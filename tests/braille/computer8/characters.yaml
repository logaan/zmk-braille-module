# computer8 characters
#
# computer8: one case for every printable US ASCII character and for the Braille space chord.
#
# Table source: the U.S. English 8-dot computer braille table of liblouis
# (tables/en-us-comp8.ctb with its includes latinLetterDef8Dots.uti and loweredDigits6Dots.uti),
# retrieved 2026-09-27 from https://github.com/liblouis/liblouis (master); SHA-256
# en-us-comp8.ctb 23194fbfa9cc2a4f771094aee830825128c44565b797c55815c4a949415dc29f,
# latinLetterDef8Dots.uti 3b6d481e1c568ce6642e9300c3f039bda1effd2f8342cd5e5a4129faa674ebee,
# loweredDigits6Dots.uti 7dc6e70c78258c393dd7a8fad0280c3f0163621f051a3ac6b4ffc97f9ca49221.
# Confirmed against VoiceOver's installed Liblouis en_US-comp8-ext.tbl on macOS 26.6.2:
# all 94 non-space ASCII definitions match. This is not the legacy Duxbury variant
# (whose underscore differs). Provenance and all 256 entries: references/research/computer8.yaml.
#
# Format
#   mode: the character table the cases run in (ueb1, ueb2 or computer8).
#   cases: each case is one test.
#     name: what the case checks.
#     inputs: the chords in order; each chord lists the Braille keys pressed as dot numbers 1-8;
#             [] is the Braille space chord (the Braille space key alone).
#     outputs: the characters the host receives, in order, one string per character.
#     source: where the expected output comes from.
# Each case starts from a fresh engine: no pending input, and UEB context at its reset values
# (numeric mode off, no capitals mode, grade 1 mode off, at the beginning of a word).
# Outputs list only host characters; display notices, such as for a dropped prefix, are not outputs.

mode: computer8
cases:
