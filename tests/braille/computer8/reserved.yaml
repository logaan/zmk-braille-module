# computer8 reserved patterns
#
# computer8: every eight-dot pattern that maps to no printable character sends nothing to the host.
#
# These phase-03 entries have no host output and use the dropped-prefix notification hook;
# phase 05 supplies its brief display presentation. User overrides may bind them.
# The zero-dot pattern is not a chord and cannot be entered. Dot 7 alone and dot 8 alone
# are Delete and Return in the factory command table; dots 7-8 together ARE reserved.
# All 159 enterable reserved patterns appear here. references/research/computer8.yaml
# publishes all 256 entries and documents the ASCII-only policy (not extended Unicode).
#
# Format
#   mode: the character table the cases run in (ueb1, ueb2 or computer8).
#   cases: each case is one test.
#     name: what the case checks.
#     inputs: the chords in order; each chord lists the Braille keys pressed as dot numbers 1-8;
#             [] is the Braille space chord (the Braille space key alone).
#     outputs: the characters the host receives, in order, one string per character.
#     source: where the expected output comes from.
# Each case starts from a fresh engine: no pending input, and UEB context at its reset values
# (numeric mode off, no capitals mode, grade 1 mode off, at the beginning of a word).
# Outputs list only host characters; display notices, such as for a dropped prefix, are not outputs.

mode: computer8
cases:
  - {name: "reserved pattern 78", inputs: [[7, 8]], outputs: [], source: "phase 03 plan: reserved entry"}
  - {name: "reserved pattern 27", inputs: [[2, 7]], outputs: [], source: "phase 04 plan: reserved entry"}
