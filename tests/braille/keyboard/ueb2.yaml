# ueb2 keyboard characters and contractions
#
# ueb2 keyboard subset: one case for each character of the US MacBook Air keyboard in
# references/01-mba-keys.yaml (every key marked character: true, unshifted then shifted), in
# keyboard row order. Each case is copied unchanged from tests/braille/ueb2/, which has the full set.
#
# Space has no case of its own here: every ueb2 case ends with the Braille space chord, which
# the host receives as a space after the resolved word.
#
# After the keyboard characters come all of tests/braille/ueb2/contractions.yaml, unchanged:
# every contraction of the nine classes, standing alone where it has a word reading and in
# its rulebook example, then capital prefixes and capitalised words with contractions.
#
# Format
#   mode: the character table the cases run in (ueb1, ueb2 or computer8).
#   cases: each case is one test.
#     name: what the case checks.
#     inputs: the chords in order; each chord lists the Braille keys pressed as dot numbers 1-8;
#             [] is the Braille space chord (the Braille space key alone).
#     outputs: the characters the host receives, in order, one string per character.
#     source: where the expected output comes from.
# Each case starts from a fresh engine: no pending input, and UEB context at its reset values
# (numeric mode off, no capitals mode, grade 1 mode off, at the beginning of a word).
# Outputs list only host characters; display notices, such as for a dropped prefix, are not outputs.

mode: ueb2
cases:
  - {name: "grave accent alone", inputs: [[4, 6], [1, 6], []], outputs: ["`", " "], source: "rulebook Appendix 3 p.325"}
  - {name: "tilde (swung dash) ~", inputs: [[4], [3, 5], []], outputs: ["~", " "], source: "rulebook 3.25 p.38"}
  - {name: "numeric indicator then 1", inputs: [[3, 4, 5, 6], [1], []], outputs: ["1", " "], source: "rulebook 6.1 p.65"}
  - {name: "exclamation mark after a word", inputs: [[1], [1, 2], [2, 3, 5], []], outputs: ["a", "b", "o", "u", "t", "!", " "], source: "rulebook 2.6.3 p.17"}
  - {name: "numeric indicator then 2", inputs: [[3, 4, 5, 6], [1, 2], []], outputs: ["2", " "], source: "rulebook 6.1 p.65"}
  - {name: "commercial at @", inputs: [[4], [1], []], outputs: ["@", " "], source: "rulebook 3.7 p.27"}
  - {name: "numeric indicator then 3", inputs: [[3, 4, 5, 6], [1, 4], []], outputs: ["3", " "], source: "rulebook 6.1 p.65"}
  - {name: "number sign #", inputs: [[4, 5, 6], [1, 4, 5, 6], []], outputs: ["#", " "], source: "rulebook 3.19 p.35"}
  - {name: "numeric indicator then 4", inputs: [[3, 4, 5, 6], [1, 4, 5], []], outputs: ["4", " "], source: "rulebook 6.1 p.65"}
  - {name: "dollar sign $", inputs: [[4], [2, 3, 4], []], outputs: ["$", " "], source: "rulebook 3.10 p.28"}
  - {name: "numeric indicator then 5", inputs: [[3, 4, 5, 6], [1, 5], []], outputs: ["5", " "], source: "rulebook 6.1 p.65"}
  - {name: "percent sign %", inputs: [[4, 6], [3, 5, 6], []], outputs: ["%", " "], source: "rulebook 3.21 p.36"}
