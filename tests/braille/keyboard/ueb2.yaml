# ueb2 keyboard subset
#
# ueb2 keyboard subset: every case of tests/braille/ueb2/ whose output can be typed with the
# character keys of the US MacBook Air keyboard in references/01-mba-keys.yaml (the 95 characters
# of the keys marked character: true, unshifted and shifted). Cases with no output are left out,
# since they type nothing. Cases are copied unchanged, in the order of the files:
# contractions.yaml, shortforms-list.yaml, reading-rules.yaml, indicators.yaml, ueb1-signs.yaml, rulebook-examples.yaml.
#
# Format
#   mode: the character table the cases run in (ueb1, ueb2 or computer8).
#   cases: each case is one test.
#     name: what the case checks.
#     inputs: the chords in order; each chord lists the Braille keys pressed as dot numbers 1-8;
#             [] is the Braille space chord (the Braille space key alone).
#     outputs: the characters the host receives, in order, one string per character.
#     source: where the expected output comes from.
# Each case starts from a fresh engine: no pending input, and UEB context at its reset values
# (numeric mode off, no capitals mode, grade 1 mode off, at the beginning of a word).
# Outputs list only host characters; display notices, such as for a dropped prefix, are not outputs.

mode: ueb2
cases:
  - {name: "alphabetic wordsign but: ⠃ standing alone", inputs: [[1, 2], []], outputs: ["b", "u", "t", " "], source: "rulebook 10.1 p.113 (references/research/ueb-grade2-contractions.yaml)"}
  - {name: "alphabetic wordsign but in a rulebook example: \"but, no buts\"", inputs: [[2, 3, 6], [1, 2], [2], [], [1, 3, 4, 5], [1, 3, 5], [], [1, 2], [1, 3, 6], [2, 3, 4, 5], [2, 3, 4], [3, 5, 6], []], outputs: ["\"", "b", "u", "t", ",", " ", "n", "o", " ", "b", "u", "t", "s", "\"", " "], source: "rulebook 10.1.1 p.115"}
  - {name: "alphabetic wordsign can: ⠉ standing alone", inputs: [[1, 4], []], outputs: ["c", "a", "n", " "], source: "rulebook 10.1 p.113 (references/research/ueb-grade2-contractions.yaml)"}
  - {name: "alphabetic wordsign can in a rulebook example: Can", inputs: [[6], [1, 4], []], outputs: ["C", "a", "n", " "], source: "rulebook 10.12.2 p.165"}
  - {name: "alphabetic wordsign do: ⠙ standing alone", inputs: [[1, 4, 5], []], outputs: ["d", "o", " "], source: "rulebook 10.1 p.113 (references/research/ueb-grade2-contractions.yaml)"}
