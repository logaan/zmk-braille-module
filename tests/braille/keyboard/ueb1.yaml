# ueb1 keyboard subset
#
# ueb1 keyboard subset: every case of tests/braille/ueb1/ whose output can be typed with the
# character keys of the US MacBook Air keyboard in references/01-mba-keys.yaml (the 95 characters
# of the keys marked character: true, unshifted and shifted). Cases with no output are left out,
# since they type nothing. Cases are copied unchanged, in the order of the files:
# letters.yaml, capitals.yaml, numbers.yaml, punctuation.yaml, indicators.yaml, pending.yaml.
#
# Format
#   mode: the character table the cases run in (ueb1, ueb2 or computer8).
#   cases: each case is one test.
#     name: what the case checks.
#     inputs: the chords in order; each chord lists the Braille keys pressed as dot numbers 1-8;
#             [] is the Braille space chord (the Braille space key alone).
#     outputs: the characters the host receives, in order, one string per character.
#     source: where the expected output comes from.
# Each case starts from a fresh engine: no pending input, and UEB context at its reset values
# (numeric mode off, no capitals mode, grade 1 mode off, at the beginning of a word).
# Outputs list only host characters; display notices, such as for a dropped prefix, are not outputs.

mode: ueb1
cases:
  - {name: "letter a", inputs: [[1]], outputs: ["a"], source: "rulebook 4.1 p.45 (references/research/ueb-literary-signs.yaml)"}
  - {name: "letter b", inputs: [[1, 2]], outputs: ["b"], source: "rulebook 4.1 p.45 (references/research/ueb-literary-signs.yaml)"}
