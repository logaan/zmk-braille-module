# ueb1 capitals indicators
#
# ueb1: capitalised word and passage indicators, the capitals terminator, and the
# rulebook and constructed cases of references/research/ueb-capitalisation.yaml.
#
# Format
#   mode: the character table the cases run in (ueb1, ueb2 or computer8).
#   cases: each case is one test.
#     name: what the case checks.
#     inputs: the chords in order; each chord lists the Braille keys pressed as dot numbers 1-8;
#             [] is the Braille space chord (the Braille space key alone).
#     outputs: the characters the host receives, in order, one string per character.
#     source: where the expected output comes from.
# Each case starts from a fresh engine: no pending input, and UEB context at its reset values
# (numeric mode off, no capitals mode, grade 1 mode off, at the beginning of a word).
# Outputs list only host characters; display notices, such as for a dropped prefix, are not outputs.

mode: ueb1
cases:
  - {name: "capitalised word indicator alone has no output", inputs: [[6], [6]], outputs: [], source: "rulebook 8.4 p.90"}
  - {name: "capitalised passage indicator alone has no output", inputs: [[6], [6], [6]], outputs: [], source: "rulebook 8.5 p.93"}
  - {name: "capitals terminator alone has no output", inputs: [[6], [3]], outputs: [], source: "rulebook 8.6 p.96"}
  - {name: "capitalised word ends at a space", inputs: [[6], [6], [1], [1, 2], [], [1, 4]], outputs: ["A", "B", " ", "c"], source: "rulebook 8.4.2 p.90"}
  - {name: "capitalised word ends at a hyphen", inputs: [[6], [6], [1], [3, 6], [1, 2]], outputs: ["A", "-", "b"], source: "rulebook 8.4.2 p.91"}
  - {name: "capitalised word ends at a single capital letter", inputs: [[6], [6], [1], [6], [1, 2], [1, 4]], outputs: ["A", "B", "c"], source: "rulebook 8.4.2 p.90"}
  - {name: "capitalised word ends at the capitals terminator", inputs: [[6], [6], [1], [1, 2], [6], [3], [1, 4]], outputs: ["A", "B", "c"], source: "rulebook 8.6.3 p.96"}
  - {name: "capitalised passage continues across spaces until the terminator", inputs: [[6], [6], [6], [1], [], [1, 2], [6], [3], [], [1, 4]], outputs: ["A", " ", "B", " ", "c"], source: "rulebook 8.5.3 p.93"}
  - {name: "capitalised passage continues across punctuation", inputs: [[6], [6], [6], [1], [2], [], [1, 2], [2, 5, 6], [6], [3]], outputs: ["A", ",", " ", "B", "."], source: "rulebook 8.5.2 p.93"}
  - {name: "example O", inputs: [[6], [1, 3, 5]], outputs: ["O"], source: "rulebook 8.3.1 p.89 (references/research/ueb-capitalisation.yaml)"}
  - {name: "example V", inputs: [[5, 6], [6], [1, 2, 3, 6]], outputs: ["V"], source: "rulebook 8.3.1 p.89 (references/research/ueb-capitalisation.yaml)"}
  - {name: "example 20B", inputs: [[3, 4, 5, 6], [1, 2], [2, 4, 5], [6], [1, 2]], outputs: ["2", "0", "B"], source: "rulebook 8.3.1 p.89 (references/research/ueb-capitalisation.yaml)"}
  - {name: "example B.C.", inputs: [[6], [1, 2], [2, 5, 6], [6], [1, 4], [2, 5, 6]], outputs: ["B", ".", "C", "."], source: "rulebook 8.3.1 p.89 (references/research/ueb-capitalisation.yaml)"}
