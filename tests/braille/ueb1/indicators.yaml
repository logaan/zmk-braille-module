# ueb1 grade 1 indicators and context
#
# ueb1: the grade 1 symbol, word and passage indicators and terminator, and the context cases of
# references/research/ueb-grade-1-indicators.yaml and ueb-indicator-context.yaml.
#
# Format
#   mode: the character table the cases run in (ueb1, ueb2 or computer8).
#   cases: each case is one test.
#     name: what the case checks.
#     inputs: the chords in order; each chord lists the Braille keys pressed as dot numbers 1-8;
#             [] is the Braille space chord (the Braille space key alone).
#     outputs: the characters the host receives, in order, one string per character.
#     source: where the expected output comes from.
# Each case starts from a fresh engine: no pending input, and UEB context at its reset values
# (numeric mode off, no capitals mode, grade 1 mode off, at the beginning of a word).
# Outputs list only host characters; display notices, such as for a dropped prefix, are not outputs.

mode: ueb1
cases:
  - {name: "grade 1 symbol indicator has no output", inputs: [[5, 6], [1]], outputs: ["a"], source: "rulebook 5.2 p.57"}
  - {name: "grade 1 word indicator has no output", inputs: [[5, 6], [5, 6], [1]], outputs: ["a"], source: "rulebook 5.3 p.58"}
  - {name: "grade 1 passage indicator has no output", inputs: [[5, 6], [5, 6], [5, 6], [1]], outputs: ["a"], source: "rulebook 5.4 p.58"}
  - {name: "grade 1 terminator has no output", inputs: [[1], [5, 6], [3], [1, 2]], outputs: ["a", "b"], source: "rulebook 5.5 p.59"}
  - {name: "a question mark after a grade 1 indicator", inputs: [[5, 6], [2, 3, 6]], outputs: ["?"], source: "rulebook 7.6.9 p.86"}
  - {name: "a grade 1 indicator ends a capitalised word", inputs: [[6], [6], [1], [5, 6], [1, 2], [1, 4]], outputs: ["A", "b", "c"], source: "rulebook 8.4.2 p.90"}
  - {name: "example al", inputs: [[5, 6], [1], [1, 2, 3]], outputs: ["a", "l"], source: "rulebook 2.6.1 p.15 (references/research/ueb-grade-1-indicators.yaml)"}
  - {name: "example e-x-u-d-e", inputs: [[5, 6], [5, 6], [1, 5], [3, 6], [1, 3, 4, 6], [3, 6], [1, 3, 6], [3, 6], [1, 4, 5], [3, 6], [1, 5]], outputs: ["e", "-", "x", "-", "u", "-", "d", "-", "e"], source: "rulebook 2.6.1 p.15 (references/research/ueb-grade-1-indicators.yaml)"}
  - {name: "example 5-yrf-678", inputs: [[3, 4, 5, 6], [1, 5], [3, 6], [5, 6], [1, 3, 4, 5, 6], [1, 2, 3, 5], [1, 2, 4], [3, 6], [3, 4, 5, 6], [1, 2, 4], [1, 2, 4, 5], [1, 2, 5]], outputs: ["5", "-", "y", "r", "f", "-", "6", "7", "8"], source: "rulebook 2.6.1 p.15 (references/research/ueb-grade-1-indicators.yaml)"}
  - {name: "example th--r", inputs: [[2, 3, 4, 5], [1, 2, 5], [3, 6], [3, 6], [5, 6], [1, 2, 3, 5]], outputs: ["t", "h", "-", "-", "r"], source: "rulebook 2.6.1 p.15 (references/research/ueb-grade-1-indicators.yaml)"}
