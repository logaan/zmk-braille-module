# ueb1 numbers and numeric mode
#
# ueb1: every numeric indicator, digits continuing numeric mode, numeric punctuation, the numeric
# space, how numeric mode ends, and the cases of references/research/ueb-numeric-mode.yaml.
#
# Format
#   mode: the character table the cases run in (ueb1, ueb2 or computer8).
#   cases: each case is one test.
#     name: what the case checks.
#     inputs: the chords in order; each chord lists the Braille keys pressed as dot numbers 1-8;
#             [] is the Braille space chord (the Braille space key alone).
#     outputs: the characters the host receives, in order, one string per character.
#     source: where the expected output comes from.
# Each case starts from a fresh engine: no pending input, and UEB context at its reset values
# (numeric mode off, no capitals mode, grade 1 mode off, at the beginning of a word).
# Outputs list only host characters; display notices, such as for a dropped prefix, are not outputs.

mode: ueb1
cases:
  - {name: "numeric indicator then 1", inputs: [[3, 4, 5, 6], [1]], outputs: ["1"], source: "rulebook 6.1 p.65"}
  - {name: "numeric indicator then 2", inputs: [[3, 4, 5, 6], [1, 2]], outputs: ["2"], source: "rulebook 6.1 p.65"}
  - {name: "numeric indicator then 3", inputs: [[3, 4, 5, 6], [1, 4]], outputs: ["3"], source: "rulebook 6.1 p.65"}
  - {name: "numeric indicator then 4", inputs: [[3, 4, 5, 6], [1, 4, 5]], outputs: ["4"], source: "rulebook 6.1 p.65"}
  - {name: "numeric indicator then 5", inputs: [[3, 4, 5, 6], [1, 5]], outputs: ["5"], source: "rulebook 6.1 p.65"}
  - {name: "numeric indicator then 6", inputs: [[3, 4, 5, 6], [1, 2, 4]], outputs: ["6"], source: "rulebook 6.1 p.65"}
  - {name: "numeric indicator then 7", inputs: [[3, 4, 5, 6], [1, 2, 4, 5]], outputs: ["7"], source: "rulebook 6.1 p.65"}
  - {name: "numeric indicator then 8", inputs: [[3, 4, 5, 6], [1, 2, 5]], outputs: ["8"], source: "rulebook 6.1 p.65"}
  - {name: "numeric indicator then 9", inputs: [[3, 4, 5, 6], [2, 4]], outputs: ["9"], source: "rulebook 6.1 p.65"}
  - {name: "numeric indicator then 0", inputs: [[3, 4, 5, 6], [2, 4, 5]], outputs: ["0"], source: "rulebook 6.1 p.65"}
  - {name: "numeric indicator then ,", inputs: [[3, 4, 5, 6], [2]], outputs: [","], source: "rulebook 6.1 p.65"}
  - {name: "numeric indicator then .", inputs: [[3, 4, 5, 6], [2, 5, 6]], outputs: ["."], source: "rulebook 6.1 p.65"}
  - {name: "digit 1 continuing numeric mode", inputs: [[3, 4, 5, 6], [1], [1]], outputs: ["1", "1"], source: "rulebook 6.2.1 p.66"}
  - {name: "digit 2 continuing numeric mode", inputs: [[3, 4, 5, 6], [1], [1, 2]], outputs: ["1", "2"], source: "rulebook 6.2.1 p.66"}
  - {name: "digit 3 continuing numeric mode", inputs: [[3, 4, 5, 6], [1], [1, 4]], outputs: ["1", "3"], source: "rulebook 6.2.1 p.66"}
  - {name: "digit 4 continuing numeric mode", inputs: [[3, 4, 5, 6], [1], [1, 4, 5]], outputs: ["1", "4"], source: "rulebook 6.2.1 p.66"}
  - {name: "digit 5 continuing numeric mode", inputs: [[3, 4, 5, 6], [1], [1, 5]], outputs: ["1", "5"], source: "rulebook 6.2.1 p.66"}
  - {name: "digit 6 continuing numeric mode", inputs: [[3, 4, 5, 6], [1], [1, 2, 4]], outputs: ["1", "6"], source: "rulebook 6.2.1 p.66"}
  - {name: "digit 7 continuing numeric mode", inputs: [[3, 4, 5, 6], [1], [1, 2, 4, 5]], outputs: ["1", "7"], source: "rulebook 6.2.1 p.66"}
  - {name: "digit 8 continuing numeric mode", inputs: [[3, 4, 5, 6], [1], [1, 2, 5]], outputs: ["1", "8"], source: "rulebook 6.2.1 p.66"}
  - {name: "digit 9 continuing numeric mode", inputs: [[3, 4, 5, 6], [1], [2, 4]], outputs: ["1", "9"], source: "rulebook 6.2.1 p.66"}
  - {name: "digit 0 continuing numeric mode", inputs: [[3, 4, 5, 6], [1], [2, 4, 5]], outputs: ["1", "0"], source: "rulebook 6.2.1 p.66"}
  - {name: "comma inside a number", inputs: [[3, 4, 5, 6], [1], [2], [1, 5], [2, 4, 5], [2, 4, 5]], outputs: ["1", ",", "5", "0", "0"], source: "rulebook 6.2.1 p.66"}
  - {name: "full stop inside a number", inputs: [[3, 4, 5, 6], [1, 2], [2, 5, 6], [1, 5]], outputs: ["2", ".", "5"], source: "rulebook 6.2.1 p.66"}
  - {name: "numeric space then 1", inputs: [[3, 4, 5, 6], [1], [5], [1]], outputs: ["1", " ", "1"], source: "rulebook 6.6.1 p.70"}
  - {name: "numeric space then 2", inputs: [[3, 4, 5, 6], [1], [5], [1, 2]], outputs: ["1", " ", "2"], source: "rulebook 6.6.1 p.70"}
  - {name: "numeric space then 3", inputs: [[3, 4, 5, 6], [1], [5], [1, 4]], outputs: ["1", " ", "3"], source: "rulebook 6.6.1 p.70"}
  - {name: "numeric space then 4", inputs: [[3, 4, 5, 6], [1], [5], [1, 4, 5]], outputs: ["1", " ", "4"], source: "rulebook 6.6.1 p.70"}
