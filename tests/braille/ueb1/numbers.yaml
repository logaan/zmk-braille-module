  - {name: "numeric space then 9", inputs: [[3, 4, 5, 6], [1], [5], [2, 4]], outputs: ["1", " ", "9"], source: "rulebook 6.6.1 p.70"}
  - {name: "numeric space then 0", inputs: [[3, 4, 5, 6], [1], [5], [2, 4, 5]], outputs: ["1", " ", "0"], source: "rulebook 6.6.1 p.70"}
  - {name: "a letter k-z ends numeric mode", inputs: [[3, 4, 5, 6], [1, 4], [1, 3, 4]], outputs: ["3", "m"], source: "rulebook 6.5.2 p.68"}
  - {name: "a space ends numeric mode", inputs: [[3, 4, 5, 6], [1], [], [1]], outputs: ["1", " ", "a"], source: "rulebook 6.3.1 p.67"}
  - {name: "a hyphen ends numeric mode", inputs: [[3, 4, 5, 6], [2, 4], [3, 6], [3, 4, 5, 6], [1], [2, 4, 5]], outputs: ["9", "-", "1", "0"], source: "rulebook 6.3.1 p.67"}
  - {name: "a capital letter ends numeric mode", inputs: [[3, 4, 5, 6], [1, 4], [6], [1, 2]], outputs: ["3", "B"], source: "rulebook 6.5.2 p.68"}
