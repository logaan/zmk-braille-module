  - {name: "example p. 7", inputs: [[5, 6], [1, 2, 3, 4], [2, 5, 6], [], [3, 4, 5, 6], [1, 2, 4, 5], []], outputs: ["p", ".", " ", "7", " "], source: "rulebook 5.7.1 p.60"}
