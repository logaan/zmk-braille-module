  - {name: "capital letter C after a grade 1 symbol indicator", inputs: [[5, 6], [6], [1, 4], []], outputs: ["C", " "], source: "rulebook 5.8.1 p.61"}
  - {name: "letter d after a grade 1 symbol indicator", inputs: [[5, 6], [1, 4, 5], []], outputs: ["d", " "], source: "rulebook 5.7.1 p.60"}
  - {name: "capital letter D after a grade 1 symbol indicator", inputs: [[5, 6], [6], [1, 4, 5], []], outputs: ["D", " "], source: "rulebook 5.8.1 p.61"}
