# ueb2 reading rules
#
# ueb2: standing alone, word start, word parts, lower-sign contact, shortforms in longer words,
# writing rules read as written, and the ambiguous sequences of
# references/research/ueb-grade2-word-boundaries.yaml.
#
# Every case ends with a Braille space chord: ueb2 resolves a buffered word only on whitespace,
# and the host receives the word, then the space.
#
# Format
#   mode: the character table the cases run in (ueb1, ueb2 or computer8).
#   cases: each case is one test.
#     name: what the case checks.
#     inputs: the chords in order; each chord lists the Braille keys pressed as dot numbers 1-8;
#             [] is the Braille space chord (the Braille space key alone).
#     outputs: the characters the host receives, in order, one string per character.
#     source: where the expected output comes from.
# Each case starts from a fresh engine: no pending input, and UEB context at its reset values
# (numeric mode off, no capitals mode, grade 1 mode off, at the beginning of a word).
# Outputs list only host characters; display notices, such as for a dropped prefix, are not outputs.

mode: ueb2
cases:
  - {name: "example x", inputs: [[5, 6], [1, 3, 4, 6], []], outputs: ["x", " "], source: "rulebook 2.6.1 p.15"}
  - {name: "example b-1", inputs: [[5, 6], [1, 2], [3, 6], [3, 4, 5, 6], [1], []], outputs: ["b", "-", "1", " "], source: "rulebook 5.7.1 p.60"}
  - {name: "example al", inputs: [[5, 6], [1], [1, 2, 3], []], outputs: ["a", "l", " "], source: "rulebook 2.6.1 p.15"}
  - {name: "example ab/cd", inputs: [[1], [1, 2], [4, 5, 6], [3, 4], [1, 4], [1, 4, 5], []], outputs: ["a", "b", "/", "c", "d", " "], source: "rulebook 2.6.3 p.18"}
  - {name: "example still-life and whiskey-still", inputs: [[3, 4], [3, 6], [1, 2, 3], [2, 4], [1, 2, 4], [1, 5], [], [1, 2, 3, 4, 6], [], [1, 5, 6], [2, 4], [2, 3, 4], [1, 3], [1, 5], [1, 3, 4, 5, 6], [3, 6], [3, 4], []], outputs: ["s", "t", "i", "l", "l", "-", "l", "i", "f", "e", " ", "a", "n", "d", " ", "w", "h", "i", "s", "k", "e", "y", "-", "s", "t", "i", "l", "l", " "], source: "rulebook 10.2.1 p.117"}
  - {name: "example St.", inputs: [[6], [2, 3, 4], [2, 3, 4, 5], [2, 5, 6], []], outputs: ["S", "t", ".", " "], source: "rulebook 10.4.2 p.121"}
  - {name: "example d:", inputs: [[5, 6], [1, 4, 5], [2, 5], []], outputs: ["d", ":", " "], source: "rulebook 2.6.3 p.17"}
  - {name: "example a:o", inputs: [[1], [5, 6], [2, 5], [1, 3, 5], []], outputs: ["a", ":", "o", " "], source: "rulebook 7.1.3 p.78"}
  - {name: "example dist.", inputs: [[2, 5, 6], [2, 3, 4, 5], [2, 5, 6], []], outputs: ["d", "i", "s", "t", ".", " "], source: "rulebook 10.6.4 p.129"}
  - {name: "example .doc", inputs: [[5, 6], [2, 5, 6], [1, 4, 5], [1, 3, 5], [1, 4], []], outputs: [".", "d", "o", "c", " "], source: "rulebook 7.1.3 p.78"}
