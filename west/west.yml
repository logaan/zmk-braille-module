# Development and CI workspace for the Braille module.
#
# Pins the one ZMK revision the module and both baseline keyboards use: the
# most recent ZMK release (verified via GitHub releases/latest on 2026-10-18).
# v0.3.0 = edf5c0814fd3ea202e43aad2d68fd32e882a518c
# Initialize a west workspace from this manifest; both keyboards pin the same
# revision in their own config/west.yml.
#
# cirque-input-module and zmk-rgbled-widget are the Toucan's community modules,
# at the revisions its config pins, for baseline compatibility checks.
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: geeksville
      url-base: https://github.com/geeksville
    - name: caksoylar
      url-base: https://github.com/caksoylar
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    - name: cirque-input-module
      remote: geeksville
      # Snapshot of upstream toucan, matching the keyboard manifest.
      revision: effec100f0cd3a38e7fba3adfea394586cc84cab
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3
  self:
    path: manifest
