# US English (ANSI) MacBook Air input targets, ordered by physical rows.
# One entry per target key; non-character keys keep the same name when shifted.
# Source: https://www.apple.com/macbook-air/specs/

# Top row
- {base: "Escape", shifted: "Escape", character: false}

# Number row
- {base: "`", shifted: "~", character: true}
- {base: "1", shifted: "!", character: true}
- {base: "2", shifted: "@", character: true}
- {base: "3", shifted: "#", character: true}
- {base: "4", shifted: "$", character: true}
- {base: "5", shifted: "%", character: true}
- {base: "6", shifted: "^", character: true}
- {base: "7", shifted: "&", character: true}
- {base: "8", shifted: "*", character: true}
- {base: "9", shifted: "(", character: true}
- {base: "0", shifted: ")", character: true}
- {base: "-", shifted: "_", character: true}
- {base: "=", shifted: "+", character: true}
- {base: "Delete", shifted: "Delete", character: false}

# QWERTY row
- {base: "Tab", shifted: "Tab", character: false}
- {base: "q", shifted: "Q", character: true}
- {base: "w", shifted: "W", character: true}
- {base: "e", shifted: "E", character: true}
- {base: "r", shifted: "R", character: true}
- {base: "t", shifted: "T", character: true}
- {base: "y", shifted: "Y", character: true}
- {base: "u", shifted: "U", character: true}
- {base: "i", shifted: "I", character: true}
- {base: "o", shifted: "O", character: true}
- {base: "p", shifted: "P", character: true}
- {base: "[", shifted: "{", character: true}
- {base: "]", shifted: "}", character: true}
- {base: "\\", shifted: "|", character: true}

# Home row
- {base: "a", shifted: "A", character: true}
- {base: "s", shifted: "S", character: true}
- {base: "d", shifted: "D", character: true}
- {base: "f", shifted: "F", character: true}
- {base: "g", shifted: "G", character: true}
- {base: "h", shifted: "H", character: true}
- {base: "j", shifted: "J", character: true}
- {base: "k", shifted: "K", character: true}
- {base: "l", shifted: "L", character: true}
- {base: ";", shifted: ":", character: true}
- {base: "'", shifted: "\"", character: true}
- {base: "Return", shifted: "Return", character: false}

# Shift row
- {base: "Left Shift", shifted: "Left Shift", character: false}
- {base: "z", shifted: "Z", character: true}
- {base: "x", shifted: "X", character: true}
- {base: "c", shifted: "C", character: true}
- {base: "v", shifted: "V", character: true}
- {base: "b", shifted: "B", character: true}
- {base: "n", shifted: "N", character: true}
- {base: "m", shifted: "M", character: true}
- {base: ",", shifted: "<", character: true}
- {base: ".", shifted: ">", character: true}
- {base: "/", shifted: "?", character: true}
- {base: "Right Shift", shifted: "Right Shift", character: false}

# Bottom row (the up arrow is above the down arrow)
- {base: "Control", shifted: "Control", character: false}
- {base: "Left Option", shifted: "Left Option", character: false}
- {base: "Left Command", shifted: "Left Command", character: false}
- {base: " ", shifted: " ", character: true}
- {base: "Right Command", shifted: "Right Command", character: false}
- {base: "Right Option", shifted: "Right Option", character: false}
- {base: "Left Arrow", shifted: "Left Arrow", character: false}
- {base: "Up Arrow", shifted: "Up Arrow", character: false}
- {base: "Down Arrow", shifted: "Down Arrow", character: false}
- {base: "Right Arrow", shifted: "Right Arrow", character: false}
