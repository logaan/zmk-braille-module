policy:
  mask: Dot n is bit n-1; dots 7 and 8 are independent bits 0x40 and 0x80.
  characters: The 94 printable non-space US ASCII characters, one cell each.
  space: Braille-space-only (0x100) emits literal ASCII space via the command table.
  zero: Reserved; no keys means no chord, no host output and no notice.
  reserved: >-
    Nonzero reserved patterns emit nothing and invoke the existing dropped-prefix
    notification hook once. Phase 05 will present its brief unassigned display
    notice. User overrides may bind them; zero cannot be physically entered.
  commands: >-
    Dot 7 alone (0x40) is Delete/Backspace, dot 8 alone (0x80) is Return, per
    Apple's 8-dot commands. Both are reserved from the character table and occur
    only in the mode's command table. Space-bearing commands use bit 8 and cannot
    collide with dot-only character cells. Dots 78 (0xc0) are reserved, not a
    newline (the upstream table has nonprintable/extended mappings outside scope).
  context: Every character rule has any predicates, any word position, and neutral class.
  latency: >-
    Factory characters commit on final release without indicators, contractions,
    or a timer. Explicit user multi-chord overrides still use common longest-prefix matching.
  counts: {character: 94, command: 2, reserved: 160, enterable_reserved: 159}
