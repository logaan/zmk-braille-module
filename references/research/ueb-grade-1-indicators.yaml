# UEB grade 1 indicators in uncontracted (ueb1) input.
# Research record for the Braille module plan (phase 03 Grade 1 literary input).

question: >-
  Where are grade 1 indicators needed in uncontracted UEB, what scope does each have, and how do
  they interact with numeric mode and capitalisation?

source:
  rulebook: references/iceb/rules-of-unified-english-braille-2024.pdf
  edition: The Rules of Unified English Braille, Third Edition 2024 (ICEB)
  page: printed page number; the PDF page is the printed page + 28
  verified: >-
    Dot patterns are decoded from the rulebook's braille characters; every rulebook fixture was
    back-translated with a reference model of the rules below and reproduces the rulebook's print
    exactly.

conventions:
  dots: list of cells in order; each cell lists its raised dots (1-6); [] is the Braille space chord
  braille: Unicode braille of the same cells, for reading only

related:
  literary_signs: references/research/ueb-literary-signs.yaml
  numeric_mode: references/research/ueb-numeric-mode.yaml
  capitalisation: references/research/ueb-capitalisation.yaml
  context_representation: references/research/ueb-indicator-context.yaml

normative:
  signs:
    - {braille: "⠰", dots: [[5, 6]], name: "grade 1 symbol indicator: grade 1 mode for the next symbol", ref: {section: "5.2.1", page: 57}}
    - {braille: "⠰⠰", dots: [[5, 6], [5, 6]], name: "grade 1 word indicator: the next symbols-sequence or the rest of the current one; ended by a space or the grade 1 terminator", ref: {section: "5.3", page: 58}}
    - {braille: "⠰⠰⠰", dots: [[5, 6], [5, 6], [5, 6]], name: "grade 1 passage indicator: the next passage; ended by the grade 1 terminator", ref: {section: "5.4", page: 58}}
    - {braille: "⠰⠄", dots: [[5, 6], [3]], name: "grade 1 terminator: ends grade 1 word or passage mode, also inside a symbols-sequence", ref: {section: "5.5", page: 59}}
  grade_1_mode_versus_uncontracted_braille:
    refs:
      - {rule: "uncontracted (grade 1) braille is different from grade 1 mode", section: "2.5.2", page: 14}
      - {rule: "grade 1 mode exists only when set by a grade 1 indicator or a numeric indicator", section: "2.5.3", page: 14}
      - {rule: "uncontracted braille may be written without grade 1 indicators", section: "2.5.5", page: 14}
      - {rule: "a grade 1 indicator sets grade 1 mode only where a symbol could be misread as a contraction or numeral", section: "5.1.1", page: 57}
      - {rule: "in a work entirely in grade 1, grade 1 indicators are used only for other reasons, e.g. a-j after digits and a question mark in an unusual position", section: "5.11.1", page: 63}
      - {rule: "a grade 1 indicator may be used where it is not required", section: "5.10.1", page: 63}
  required_in_uncontracted_text:
    - case: A lowercase letter a-j directly after a digit, full stop or comma in numeric mode.
      form: ⠰ before the letter
      refs:
        - {rule: "grade 1 indicator before a-j after a digit, full stop or comma", section: "6.5.2", page: 68}
        - {rule: "named as a reason in grade 1 text", section: "5.11.1", page: 63}
    - case: A question mark at the beginning of a word (after a space, hyphen or dash, allowing the 2.6.2 opening symbols) or standing alone, where ⠦ would read as an opening double quotation mark.
      form: ⠰⠦
      refs:
        - {rule: "question mark read as opening double quotation mark takes a grade 1 indicator", section: "7.5.2", page: 81}
        - {rule: "question mark standing alone", section: "7.5.3", page: 81}
        - {rule: "question mark following a space, hyphen or dash", section: "7.5.4", page: 81}
        - {rule: "named as a reason in grade 1 text (\"a question mark in an unusual position\")", section: "5.11.1", page: 63}
  not_required_in_uncontracted_text:
    - case: Letters, letter sequences and punctuation that would read as contractions (5.7, 7.1.3, 7.6.10, 10.9.7-10.9.9).
      reason: Uncontracted text has no contractions (5.11.1); a reader may still write the indicator (5.10.1).
  accepted_input:
    rule: >-
      Any grade 1 indicator may appear before any sign. It never produces output; the following sign
      keeps its uncontracted meaning, except that ⠦ right after a grade 1 indicator is a question
      mark and a-j after it are letters, not digits.
    refs:
      - {rule: "after a grade 1 indicator ⠦ is read as a question mark", section: "7.6.9", page: 86}
      - {rule: "grade 1 symbol indicator before punctuation that could read as a contraction (lang:uk, .doc)", section: "7.1.3", page: 77}
      - {rule: "grade 1 indicator before a letter that could read as a wordsign (b-1, p. 7)", section: "5.7.1", page: 60}
  interactions:
    numeric_mode:
      - {rule: "A grade 1 indicator is not a 6.2.1 numeric symbol, so it terminates numeric mode.", section: "6.3.1", page: 67}
      - {rule: "Grade 1 mode does not replace the numeric indicator; digits still need ⠼.", section: "5.4.2", page: 58}
      - {rule: "While grade 1 mode is in effect, a-j after a digit, full stop or comma still need ⠰.", section: "6.5.2", page: 68}
    capitalisation:
      - {rule: "A grade 1 indicator precedes a capitals indicator (⠰⠠⠭, ⠰⠠⠠⠉⠙, ⠰⠰⠠⠃).", section: "5.8.1", page: 61}
      - {rule: "A capital letter after a digit needs no grade 1 indicator.", section: "6.5.2", page: 68}
      - {rule: "A grade 1 indicator inside a capitalised word ends it (non-alphabetic symbol, 2.1 and 8.4.2); see ueb-capitalisation.yaml.", section: "8.4.2", page: 90}
    word_start:
      - {rule: "Grade 1 indicators are not among the 2.6.2 symbols that may precede the start of a word, so the sign after one does not begin a word; this is why ⠰⠦ is a question mark.", section: "2.6.2", page: 16}
      - {rule: "An opening double quotation mark goes before, not after, a grade 1 indicator.", section: "7.6.9", page: 86}

ueb1_behaviour:
  output: none for all four indicators
  effects:
    - numeric mode ends (6.3.1)
    - capitalised word mode ends (8.4.2 with 2.1); a capitalised passage continues
    - the next sign does not begin a word (2.6.2), so ⠦ reads as a question mark (7.6.9)
  grade_1_mode_state: >-
    Not tracked in the initial modes. In uncontracted input, grade 1 symbol, word and passage mode
    change no output beyond the effects above, and the terminator only closes a mode that has no
    effect there.

firmware_choices:
  - choice: Grade 1 indicators are accepted anywhere in ueb1 and produce no output.
    reason: 5.10.1 allows optional use; a user who writes contracted braille may type them from habit.
  - choice: The grade 1 terminator with no grade 1 word or passage mode in effect has the same effects as the other indicators and no output.
    reason: The rulebook defines no other meaning for ⠰⠄.
  - choice: Grade 1 mode is not stored in the initial modes' context.
    reason: It has no observable effect on uncontracted output (2.5.5, 5.11.1).

