# Listing compiled ZMK behaviors by name and fuzzy-searching them on the keyboard.
# Research record for the Braille module plan (phase 05 settings interface).

question: >-
  How can firmware on the pinned ZMK release enumerate its compiled behaviors and their
  names, and which fuzzy-matching approach works on-device for short Grade 1 queries with
  results shown on the small display?

baseline:
  zmk_release: v0.3.0
  zmk_commit: edf5c0814fd3ea202e43aad2d68fd32e882a518c
  zephyr: v3.5.0+zmk-fixes (commit dacab4875df72109b96cc8977547a0dc04875bcd)
  mcu: nRF52840 (Cortex-M4F 64 MHz, 256 KB RAM, 1 MB flash) on nice!nano v2 and Seeed XIAO nRF52840

