# Verified facts: taken from the ZMK v0.3.0 and Zephyr v3.5.0+zmk-fixes sources above.
verified:
  registry: >-
    Every behavior defined with BEHAVIOR_DT_DEFINE / BEHAVIOR_DT_INST_DEFINE adds a
    `struct zmk_behavior_ref { const struct device *device; const struct zmk_behavior_metadata metadata; }`
    to the ROM iterable section `zmk_behavior_ref`. This includes built-in behaviors, keymap-defined
    ones (hold-tap, macro, mod-morph, tap-dance, sticky-key instances) and out-of-tree module
    behaviors, including this module's own.
  runtime_enumeration: >-
    `STRUCT_SECTION_FOREACH(zmk_behavior_ref, item)` visits every registered behavior;
    `STRUCT_SECTION_COUNT` and `STRUCT_SECTION_GET` give count and indexed access. ZMK itself
    filters with `z_device_is_ready(item->device)` (`device_is_ready()` is the public form).
    Section order follows the generated variable names (devicetree ordinals), not behavior names.
  names:
    device_name: >-
      `item->device->name` is DEVICE_DT_NAME: the node's `label` property if present, else the
      node's full name. Examples at v0.3.0: `key_press`, `sticky_key`, `sticky_layer`,
      `bluetooth`, `outputs`, `transparent`, `none`, `sysreset`, `bootload`.
      This is the string `zmk_behavior_get_binding()` resolves, so it is the stable persisted
      identifier.
    display_name: >-
      With CONFIG_ZMK_BEHAVIOR_METADATA, `item->metadata.display_name` is the node's
      `display-name` property, falling back to the device name. Built-in examples: "Key Press",
      "Sticky Key", "Bluetooth", "Output Selection", "Reset", "Bootloader".
    node_label: Keymap labels such as `kp` or `sk` are not stored in the firmware.
  compiled_set: >-
    Built-in behavior nodes are `/omit-if-no-ref/` unless ZMK_BEHAVIORS_KEEP_<NAME> or
    ZMK_BEHAVIORS_KEEP_ALL (and not ZMK_BEHAVIORS_OMIT_<NAME>) is defined when behaviors are
    included. An unreferenced behavior is absent from the devicetree, has no device and is not
    in the section. The compiled set is therefore per-keyboard.
  parameter_metadata: >-
    With CONFIG_ZMK_BEHAVIOR_METADATA, `behavior_get_parameter_metadata(dev, &meta)` returns
    parameter sets; each param1/param2 value is NIL, VALUE (named constant), RANGE (min/max),
    HID_USAGE (keycode) or LAYER_ID, with an optional display name. A behavior with no
    metadata returns -ENODEV (ext_power, input_two_axis mouse move/scroll, sensor rotate at
    v0.3.0). `zmk_behavior_validate_binding()` checks a binding's params against it.
  local_ids: >-
    `zmk_behavior_local_id_map` (RAM section) exists only with CONFIG_ZMK_BEHAVIOR_LOCAL_IDS,
    which ZMK Studio selects. It is not needed to list behaviors or to persist by device name.

enumeration:
  api: |
    #include <zephyr/sys/iterable_sections.h>
    #include <drivers/behavior.h>

    STRUCT_SECTION_FOREACH(zmk_behavior_ref, item) {
        if (!device_is_ready(item->device) || braille_behavior_excluded(item->device)) {
            continue;
        }
        const char *id = item->device->name;                 /* persisted and invoked */
    #if IS_ENABLED(CONFIG_ZMK_BEHAVIOR_METADATA)
        const char *shown = item->metadata.display_name;     /* displayed and searched */
    #else
        const char *shown = id;
    #endif
        /* classify parameters with behavior_get_parameter_metadata(item->device, &meta) */
    }
  build_time_alternative: >-
    DT_FOREACH_STATUS_OKAY(<compatible>, fn) can generate a table of known compatibles, but it
    cannot discover arbitrary module or keymap behaviors without listing every compatible; the
    runtime section is the complete source.

fuzzy_search:
  candidates:
    behaviors: Typically 10-40 compiled behaviors; names up to about 32 characters.
    keycodes: About 650 names generated at build time from keys.h (mean 8.4, max 38 characters).
  normalization:
    - Compare ASCII case-insensitively.
    - Treat `_`, `-` and space in names as word boundaries that the query need not type.
    - A Braille space in the query means "start of a word"; it is not a literal character.
  match: >-
    Subsequence match (every query character appears in order), found with a two-pass
    greedy scan per candidate: forward to find the first complete match, backward from its
    end to find the tightest start. O(name length) time, no allocation, no per-candidate table.
  score:
    matched_character: 16
    at_name_start_or_word_start: 8
    consecutive_with_previous_match: 4
    gap_character_inside_match: -1
    whole_name_prefix: 32
    exact_name: 64
    tie_break: shorter name, then alphabetical
  fields: >-
    Score behaviors against both display name and device name and keep the better score; show
    the display name. Keycodes have one name each.
  ranking: >-
    Keep the best K results in a fixed array of {index, score} with insertion sort; rescan all
    candidates on every query edit. With an empty query, list candidates alphabetically.
  interface: >-
    One search function over a source that exposes a count and name(s) at an index, so the
    behavior list and the build-time keycode table share the matcher, ranking and result screen.
  cost:
    ram: K * 4 bytes for results (K = 16 is 64 bytes) plus the query buffer; no heap.
    rom: Matcher under 1 KB of code; display names already exist in ZMK's rodata when metadata is on.
    time: >-
      About 650 keycode names x ~10 characters x 2 passes is ~13k character comparisons per
      keystroke, well under 1 ms at 64 MHz; the behavior list is negligible.
  display: >-
    Show the top results that fit (two to four lines on the 128x32 OLED and the nice!view),
    highlighting the selected one; next/previous move through the K results.

# Recommendations: derived from the facts above; not stated by the sources.
recommendations:
  - Enumerate at runtime with STRUCT_SECTION_FOREACH(zmk_behavior_ref) and device_is_ready().
  - >-
    The module's Kconfig selects ZMK_BEHAVIOR_METADATA, to search and show display names and to
    classify parameters for the editors from parameter metadata instead of per-compatible tables.
  - Persist and invoke by device name; never persist local IDs or pointers.
  - >-
    Exclude the module's own Braille key behaviors (dots, Braille space, braille-mode-key) and
    `transparent`, which does nothing outside a keymap layer stack.
  - >-
    Only behaviors compiled into the firmware can be listed. Document that keymaps keep
    otherwise unreferenced built-in behaviors with `#define ZMK_BEHAVIORS_KEEP_<NAME>` or
    `ZMK_BEHAVIORS_KEEP_ALL` before including `behaviors.dtsi`.
  - Use the greedy subsequence matcher and fixed top-K ranking above; K is a Kconfig option defaulting to 16.
