# Globe/Fn actions expressible by ZMK on a macOS host.
# Research record for the Braille module plan (phase 02 factory bindings, phase 06 coverage).

question: >-
  How does the pinned ZMK release send Globe shortcuts to a macOS host,
  and how does its GLOBE usage differ from Apple's Fn modifier?

baseline:
  zmk_release: v0.3.0
  zmk_commit: edf5c0814fd3ea202e43aad2d68fd32e882a518c
  zephyr: v3.5.0+zmk-fixes (app/west.yml at v0.3.0)
  host: macOS with VoiceOver, US input layout

sources:
  zmk:
    - id: keys_h
      path: app/include/dt-bindings/zmk/keys.h
      url: https://github.com/zmkfirmware/zmk/blob/v0.3.0/app/include/dt-bindings/zmk/keys.h
      lines:
        HOME: 387
        PAGE_UP: 390
        DELETE: 395
        END: 399
        PAGE_DOWN: 402
        GLOBE: 1444-1445
    - id: hid_os_table
      path: docs/src/data/hid.js
      url: https://github.com/zmkfirmware/zmk/blob/v0.3.0/docs/src/data/hid.js
      note: ZMK's per-OS keycode support table; `os.macos` is true, false, or null (untested).
      lines:
        GLOBE: 7869
    - id: globe_footnote
      path: docs/docs/keymaps/_footnotes/globe.mdx
      text: >-
        Does not exactly replicate original key behavior on macOS, works for Globe+key
        modifiers but not Fn+key.
    - id: globe_test
      url: https://github.com/zmkfirmware/zmk/pull/1938#issuecomment-1744579039
      note: >-
        macOS Sonoma 14.0 test of `GLOBE`: Globe-n, -q, -h, -e, -f work; Globe-Backspace and
        Globe-arrows are not transformed; the built-in Fn key reports Apple vendor usage page
        0x00FF usage 0x0003, while ZMK sends Consumer page usage 0x029D; spoofing Apple VID/PID
        changed nothing.
    - id: hid_h
      path: app/include/zmk/hid.h
      url: https://github.com/zmkfirmware/zmk/blob/v0.3.0/app/include/zmk/hid.h
      lines:
        consumer_max_usage: 28-31
        report_descriptor_pages: 105-208
      note: >-
        The HID report descriptor declares only the Keyboard/Keypad, LED, Consumer and (optional)
        mouse pages; there is no Apple vendor page.
    - id: hid_c_press
      path: app/src/hid.c
      url: https://github.com/zmkfirmware/zmk/blob/v0.3.0/app/src/hid.c
      lines: 346-368
      note: zmk_hid_press/release/is_pressed handle only HID_USAGE_KEY and HID_USAGE_CONSUMER.
    - id: consumer_kconfig
      path: app/Kconfig
      url: https://github.com/zmkfirmware/zmk/blob/v0.3.0/app/Kconfig
      lines: 90-105
      note: >-
        Choice ZMK_HID_CONSUMER_REPORT_USAGES has no explicit default, so Kconfig selects its first
        entry, ZMK_HID_CONSUMER_REPORT_USAGES_FULL (usages up to 0xFFF). BASIC limits usages to 0xFF.
    - id: sticky_key
      path: app/src/behaviors/behavior_sticky_key.c
      url: https://github.com/zmkfirmware/zmk/blob/v0.3.0/app/src/behaviors/behavior_sticky_key.c
      lines: 252-328
      note: >-
        The sticky-key listener compares usage page and ID, so `&sk` holds a Consumer usage such as
        GLOBE until the next key release; `ignore-modifiers` lets stacked sticky modifiers combine.
    - id: sticky_key_dtsi
      path: app/dts/behaviors/sticky_key.dtsi
      note: Default `&sk` node sets `release-after-ms = <1000>`.
    - id: omit_if_no_ref
      paths:
        - app/include/dt-bindings/zmk/behaviors.h (lines 7-9)
        - app/dts/behaviors/key_press.dtsi
        - app/dts/behaviors/sticky_key.dtsi
        - docs/docs/features/studio.md (line 109)
      note: >-
        Built-in behavior nodes are marked `/omit-if-no-ref/` unless ZMK_BEHAVIORS_KEEP_<NAME> or
        ZMK_BEHAVIORS_KEEP_ALL is defined; unreferenced behaviors are not built.

# Verified facts: taken from the ZMK v0.3.0 source/docs listed above.
verified:
  consumer_report_default: >-
    ZMK_HID_CONSUMER_REPORT_USAGES_FULL is the default and includes GLOBE (0x029D).
    A keyboard config that sets ZMK_HID_CONSUMER_REPORT_USAGES_BASIC cannot send usages
    above 0xFF, including GLOBE.
  fn_modifier: >-
    The MacBook Fn modifier is Apple vendor usage page 0x00FF usage 0x0003. ZMK's HID descriptor
    has no vendor page, so a true Fn key cannot be sent without changing ZMK core (out of scope).
  globe: >-
    `GLOBE` (Consumer 0x029D, AC Next Keyboard Layout Select) is macos:true with the footnote that
    it works for Globe+key shortcuts but not as Fn: Globe+Delete and Globe+arrows are not
    transformed by macOS.

functions:
  - key: Fn/Globe (as Globe)
    function: Globe shortcuts (Globe+E emoji, Globe+F full screen, Globe+Q Quick Note, Globe+N, Globe+H) and the Globe-key action set in System Settings
    binding: "&sk GLOBE"
    supported: host-dependent
    evidence: "hid.js macos:true with globe footnote; PR 1938 test comment for Globe+key shortcuts"
    notes: >-
      Sticky, like the other modifiers, so the Globe usage is held while the next Braille output
      is sent. Whether a lone Globe press triggers the System Settings "Press Globe key to" action
      is untested in the sources; verify on the host.
  - key: Fn/Globe (as Fn)
    function: Fn+Delete forward delete, Fn+arrows Home/End/Page Up/Page Down
    binding: null
    supported: "no"
    notes: >-
      Fn is an Apple vendor usage ZMK cannot send. The resulting navigation functions are
      expressible directly without Fn: forward delete `&kp DELETE`, `&kp HOME`, `&kp END`,
      `&kp PAGE_UP`, and `&kp PAGE_DOWN`.

# Recommendations: derived from the facts above; not stated by the sources.
recommendations:
  - >-
    Use `&sk GLOBE` for the factory Globe action and keep the ZMK default
    ZMK_HID_CONSUMER_REPORT_USAGES_FULL. The module's documentation must flag
    ZMK_HID_CONSUMER_REPORT_USAGES_BASIC as incompatible with GLOBE.
  - >-
    Factory rules name behaviors through devicetree node labels (for example
    `DEVICE_DT_NAME(DT_NODELABEL(kp))` and `DEVICE_DT_NAME(DT_NODELABEL(sk))`) and the module's
    devicetree references `&kp` and `&sk`, so `/omit-if-no-ref/` cannot drop a behavior the
    factory tables use and a missing node fails the build instead of the action.
  - >-
    Sticky modifiers inherit `release-after-ms = <1000>` from ZMK's default `&sk`. Phase 06 should
    confirm this is long enough between chords; a module-owned sticky-key node with a longer
    timeout is the fallback.

host_verification:
  - "`&sk GLOBE` followed by Braille `e` opens the emoji picker; a lone `&sk GLOBE` action's effect is recorded."
