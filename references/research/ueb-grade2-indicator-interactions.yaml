# UEB Grade 2 contractions with numeric mode, capitals and grade 1 indicators, for ueb2.
# Research record for the Braille module plan (phase 07 UEB Grade 2 extension).

question: >-
  How do contractions interact with numeric mode, with capital letter, word and passage
  indicators, and with the grade 1 symbol, word and passage indicators and terminator; when does
  a grade 1 indicator show that a cell is a letter and not a contraction; and when is the
  uncontracted reading used?

source:
  rulebook: references/iceb/rules-of-unified-english-braille-2024.pdf
  edition: The Rules of Unified English Braille, Third Edition 2024 (ICEB)
  page: printed page number; the PDF page is the printed page + 28
  verified: >-
    Dot patterns are decoded from the rulebook's braille characters, each checked against its
    rendered glyph. Examples printed over several braille lines are joined with a space, since a
    braille line end is a space (2.1); each joined example was found verbatim in the text layer.
    A reference back-translator using the context below and the rules of
    ueb-grade2-word-boundaries.yaml reproduces every fixture in this file.

conventions:
  dots: list of cells in order; each cell lists its raised dots (1-6); [] is the Braille space chord
  braille: Unicode braille of the same cells, for reading only; dots is authoritative
  print: host output as US-layout keystrokes; curly quotes print as straight quotes

related:
  contractions: references/research/ueb-grade2-contractions.yaml
  word_boundaries: references/research/ueb-grade2-word-boundaries.yaml
  grade_1_indicators: references/research/ueb-grade-1-indicators.yaml
  numeric_mode: references/research/ueb-numeric-mode.yaml
  capitalisation: references/research/ueb-capitalisation.yaml
  context_representation: references/research/ueb-indicator-context.yaml

normative:
  grade_1_mode:
    meaning: >-
      Grade 1 is the meaning of a sign that would otherwise be read as a contraction or a numeral.
      Contractions are not used in grade 1 mode, which exists only when set by a grade 1 indicator
      or a numeric indicator.
    refs: [{section: "2.1", page: 7}, {section: "2.5.1", page: 14}, {section: "2.5.3", page: 14}, {section: "5.1.1", page: 57}]
    extent:
      - {braille: "⠰", dots: [[5, 6]], name: "grade 1 symbol indicator", effect: "grade 1 mode for the next symbol only", refs: [{section: "5.2.1", page: 57}]}
      - {braille: "⠰⠰", dots: [[5, 6], [5, 6]], name: "grade 1 word indicator", effect: "grade 1 mode for the next symbols-sequence or the rest of the current one, until a space or the grade 1 terminator", refs: [{section: "5.3.1", page: 58}, {section: "5.3.2", page: 58}]}
      - {braille: "⠰⠰⠰", dots: [[5, 6], [5, 6], [5, 6]], name: "grade 1 passage indicator", effect: "grade 1 mode for the next passage, across spaces, until the grade 1 terminator", refs: [{section: "5.4.1", page: 58}, {section: "5.4.2", page: 58}]}
      - {braille: "⠰⠄", dots: [[5, 6], [3]], name: "grade 1 terminator", effect: "ends grade 1 word, passage or numeric-indicator mode, also inside a symbols-sequence", refs: [{section: "5.5.1", page: 59}, {section: "5.5.2", page: 59}, {section: "6.5.1", page: 68}]}
      - {braille: "⠼", dots: [[3, 4, 5, 6]], name: "numeric indicator", effect: "grade 1 mode as well as numeric mode, until a space, hyphen, dash or the grade 1 terminator", refs: [{section: "5.6.1", page: 59}, {section: "5.6.2", page: 59}, {section: "6.5.1", page: 68}]}
    placement:
      - {rule: "A grade 1 indicator precedes a capitals indicator; the symbol it governs is the capital letter after it.", refs: [{section: "5.8.1", page: 61}]}
      - {rule: "An opening double quotation mark goes before a grade 1 indicator; ⠦ right after one is a question mark.", refs: [{section: "7.6.9", page: 86}]}
      - {rule: "A grade 1 indicator may be used where it is not required; the reading is the same.", refs: [{section: "5.10.1", page: 63}]}
  grade_1_indicator_marks_a_letter:
    summary: A grade 1 indicator shows that the following letter or letters are letters, not a contraction, in these cases.
    cases:
      - rule: "A letter standing alone that would read as an alphabetic wordsign; a, i and o need none."
        refs: [{section: "5.7.1", page: 60}, {section: "5.2.1", page: 57}]
        fixtures:
          - {print: "b-1", braille: "⠰⠃⠤⠼⠁", cells: [[5, 6], [1, 2], [3, 6], [3, 4, 5, 6], [1]], ref: {section: "5.7.1", page: 60}}
          - {print: "viii-x", braille: "⠧⠊⠊⠊⠤⠰⠭", cells: [[1, 2, 3, 6], [2, 4], [2, 4], [2, 4], [3, 6], [5, 6], [1, 3, 4, 6]], ref: {section: "5.7.1", page: 60}}
          - {print: "p. 7", braille: "⠰⠏⠲ ⠼⠛", cells: [[5, 6], [1, 2, 3, 4], [2, 5, 6], [], [3, 4, 5, 6], [1, 2, 4, 5]], ref: {section: "5.7.1", page: 60}}
          - {print: "p.7", braille: "⠏⠲⠼⠛", cells: [[1, 2, 3, 4], [2, 5, 6], [3, 4, 5, 6], [1, 2, 4, 5]], ref: {section: "5.7.1", page: 60}}
          - {print: "Mrs X and Mr O", braille: "⠠⠍⠗⠎ ⠰⠠⠭ ⠯ ⠠⠍⠗ ⠠⠕", cells: [[6], [1, 3, 4], [1, 2, 3, 5], [2, 3, 4], [], [5, 6], [6], [1, 3, 4, 6], [], [1, 2, 3, 4, 6], [], [6], [1, 3, 4], [1, 2, 3, 5], [], [6], [1, 3, 5]], ref: {section: "5.2.1", page: 57}}
          - {print: "the vowels are: a, e, i, o and u", braille: "⠮ ⠧⠪⠑⠇⠎ ⠜⠑⠒ ⠁⠂ ⠰⠑⠂ ⠊⠂ ⠕ ⠯ ⠰⠥", cells: [[2, 3, 4, 6], [], [1, 2, 3, 6], [2, 4, 6], [1, 5], [1, 2, 3], [2, 3, 4], [], [3, 4, 5], [1, 5], [2, 5], [], [1], [2], [], [5, 6], [1, 5], [2], [], [2, 4], [2], [], [1, 3, 5], [], [1, 2, 3, 4, 6], [], [5, 6], [1, 3, 6]], ref: {section: "5.2.1", page: 57}}
