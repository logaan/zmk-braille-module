  eligibility:
    - {rule: "A contraction is read only when grade 1 mode is off (the grade1-off condition of ueb-grade2-word-boundaries.yaml).", refs: [{section: "2.5.1", page: 14}]}
    - {rule: "In grade 1 mode every sign takes its ueb1 meaning. Cells that are only contractions in literary text (⠡ ⠩ ⠹ ⠱ ⠳ ⠌ ⠯ ⠿ ⠷ ⠮ ⠾ ⠣ ⠫ ⠻ ⠪ ⠬ ⠜ ⠢ ⠔, and the two-cell initial-letter and final-letter signs) have grade 1 meanings only in technical notation outside ueb1.", refs: [{section: "2.4.2", page: 11}, {section: "2.4.4", page: 12}]}
    - {rule: "Where a contraction's other conditions fail, the ueb1 meaning applies (reading_rules in ueb-grade2-word-boundaries.yaml).", refs: [{section: "2.4.3", page: 12}]}
  grade_1_text_reads_differently:
    summary: >-
      A work in grade 1 braille omits grade 1 indicators that contracted braille needs, so the same
      cells read differently in ueb1 and ueb2. The ueb2 reading below applies 10.1.1 to the
      rulebook's grade 1 example.
    ref: {section: "5.11.1", page: 63}
    cases:
      - {braille: "⠠⠉ ⠊⠎ ⠋⠕⠗ ⠉⠁⠝⠙⠽⠲", cells: [[6], [1, 4], [], [2, 4], [2, 3, 4], [], [1, 2, 4], [1, 3, 5], [1, 2, 3, 5], [], [1, 4], [1], [1, 3, 4, 5], [1, 4, 5], [1, 3, 4, 5, 6], [2, 5, 6]], ueb1: "C is for candy.", ueb2: "Can is for candy."}

context_representation:
  summary: >-
    ueb2 extends the ueb-indicator-context.yaml representation with grade 1 mode; ueb1 keeps
    ignoring it. The existing effects of grade 1 indicators (numeric off, capitalised word ended,
    word_start false) are unchanged.
  fields:
    grade1: {values: ["off", numeric, word, passage], reset: "off"}
    grade1_symbol: {values: [true, false], reset: false, meaning: "the next symbol, after any capitals indicators, is in grade 1 mode"}
  condition:
    grade1-off: grade1 is off and grade1_symbol is false
  transitions:
    - {after: "⠰ (grade1-indicator rule)", effect: "grade1_symbol true", refs: [{section: "5.2.1", page: 57}]}
    - {after: "⠰⠰ (grade1-indicator rule)", effect: "grade1 word, unless it is passage", refs: [{section: "5.3.1", page: 58}]}
    - {after: "⠰⠰⠰ (grade1-indicator rule)", effect: "grade1 passage", refs: [{section: "5.4.1", page: 58}]}
    - {after: "⠰⠄ (grade1-indicator rule)", effect: "grade1 off; grade1_symbol false", refs: [{section: "5.5.2", page: 59}, {section: "6.5.1", page: 68}]}
    - {after: "a numeric indicator (digit class starting with ⠼)", effect: "grade1 numeric if it is off", refs: [{section: "5.6.1", page: 59}]}
    - {after: "space, or a Return or Tab chord", effect: "grade1 off unless passage; grade1_symbol false", refs: [{section: "5.3.2", page: 58}, {section: "6.5.1", page: 68}]}
    - {after: "hyphen or dash", effect: "grade1 off if it is numeric", refs: [{section: "6.5.4", page: 69}]}
    - {after: "a capitals indicator", effect: "no change; grade1_symbol carries to the capital letter", refs: [{section: "5.8.1", page: 61}]}
    - {after: "any other sign", effect: "grade1_symbol false after the sign", refs: [{section: "5.2.1", page: 57}]}
  rule_fields:
    - grade1-indicator rules carry the grade 1 mode they set, as capitals indicator rules carry theirs
    - contraction rules have the grade1-off condition; ueb1 rows have none

firmware_choices:
  - choice: "grade1 and grade1_symbol reset with the other UEB context fields on the common reset events."
    reason: "The rulebook has no reset; clearing grade 1 mode matches clearing a capitalised passage."
  - choice: "A grade 1 passage continues across buffered words until ⠰⠄, like a capitalised passage."
    reason: "5.4.2; the buffer is a firmware unit, not a rulebook one."
  - choice: "A cell with no reading in grade 1 mode follows the shared pending-input policy, as in ueb1."
    reason: "Its grade 1 meanings are technical signs outside the literary keyboard scope (ueb-literary-signs.yaml)."
  - choice: "Numeric mode, digits and capitals keep the ueb1 rules and fixtures unchanged."
    reason: "The contraction interactions above add conditions but no second indicator implementation."
