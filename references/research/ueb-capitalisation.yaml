# UEB capitalisation for ueb1: capital letters, capitalised words and passages, and the terminator.
# Research record for the Braille module plan (phase 03 Grade 1 literary input).

question: >-
  What are the scope and termination of UEB capital letter, capitalised word and capitalised
  passage indicators, and what context does input need to apply them?

source:
  rulebook: references/iceb/rules-of-unified-english-braille-2024.pdf
  edition: The Rules of Unified English Braille, Third Edition 2024 (ICEB)
  page: printed page number; the PDF page is the printed page + 28
  verified: >-
    Dot patterns are decoded from the rulebook's braille characters; every rulebook fixture was
    back-translated with a reference model of the transitions below and reproduces the rulebook's
    print exactly.

conventions:
  dots: list of cells in order; each cell lists its raised dots (1-6); [] is the Braille space chord
  braille: Unicode braille of the same cells, for reading only

related:
  literary_signs: references/research/ueb-literary-signs.yaml
  numeric_mode: references/research/ueb-numeric-mode.yaml
  grade_1_indicators: references/research/ueb-grade-1-indicators.yaml
  context_representation: references/research/ueb-indicator-context.yaml

normative:
  signs:
    - {braille: "⠠", dots: [[6]], name: "capital letter prefix: with a lowercase letter forms one two-cell capital letter", ref: {section: "8.3.1", page: 89}}
    - {braille: "⠠⠠", dots: [[6], [6]], name: "capitalised word indicator", ref: {section: "8.4", page: 90}}
    - {braille: "⠠⠠⠠", dots: [[6], [6], [6]], name: "capitalised passage indicator", ref: {section: "8.5", page: 93}}
    - {braille: "⠠⠄", dots: [[6], [3]], name: "capitals terminator", ref: {section: "8.6", page: 96}}
  capital_letters:
    rule: A capital letter is the prefix ⠠ followed by the lowercase letter; it capitalises that letter only.
    refs:
      - {rule: "capital letter is a two-cell symbol", section: "8.3.1", page: 89}
      - {rule: "capital letters A-Z", section: "4.1", page: 45}
      - {rule: "only a modifier or ligature indicator may come between the prefix and the letter", section: "8.3.3", page: 90}
    signs:
      - {braille: "⠠⠁", dots: [[6], [1]], print: "A"}
      - {braille: "⠠⠃", dots: [[6], [1, 2]], print: "B"}
      - {braille: "⠠⠉", dots: [[6], [1, 4]], print: "C"}
      - {braille: "⠠⠙", dots: [[6], [1, 4, 5]], print: "D"}
      - {braille: "⠠⠑", dots: [[6], [1, 5]], print: "E"}
      - {braille: "⠠⠋", dots: [[6], [1, 2, 4]], print: "F"}
      - {braille: "⠠⠛", dots: [[6], [1, 2, 4, 5]], print: "G"}
      - {braille: "⠠⠓", dots: [[6], [1, 2, 5]], print: "H"}
      - {braille: "⠠⠊", dots: [[6], [2, 4]], print: "I"}
      - {braille: "⠠⠚", dots: [[6], [2, 4, 5]], print: "J"}
      - {braille: "⠠⠅", dots: [[6], [1, 3]], print: "K"}
      - {braille: "⠠⠇", dots: [[6], [1, 2, 3]], print: "L"}
      - {braille: "⠠⠍", dots: [[6], [1, 3, 4]], print: "M"}
      - {braille: "⠠⠝", dots: [[6], [1, 3, 4, 5]], print: "N"}
      - {braille: "⠠⠕", dots: [[6], [1, 3, 5]], print: "O"}
      - {braille: "⠠⠏", dots: [[6], [1, 2, 3, 4]], print: "P"}
      - {braille: "⠠⠟", dots: [[6], [1, 2, 3, 4, 5]], print: "Q"}
      - {braille: "⠠⠗", dots: [[6], [1, 2, 3, 5]], print: "R"}
      - {braille: "⠠⠎", dots: [[6], [2, 3, 4]], print: "S"}
      - {braille: "⠠⠞", dots: [[6], [2, 3, 4, 5]], print: "T"}
      - {braille: "⠠⠥", dots: [[6], [1, 3, 6]], print: "U"}
      - {braille: "⠠⠧", dots: [[6], [1, 2, 3, 6]], print: "V"}
      - {braille: "⠠⠺", dots: [[6], [2, 4, 5, 6]], print: "W"}
      - {braille: "⠠⠭", dots: [[6], [1, 3, 4, 6]], print: "X"}
      - {braille: "⠠⠽", dots: [[6], [1, 3, 4, 5, 6]], print: "Y"}
      - {braille: "⠠⠵", dots: [[6], [1, 3, 5, 6]], print: "Z"}
  capitalised_word:
    scope: The next letters-sequence, or the remainder of the current letters-sequence.
    terminated_by: [space, a single capital letter, a non-alphabetic symbol, the capitals terminator]
    not_terminated_by: [a modifier, a ligature indicator]
    refs:
      - {rule: "scope of the capitalised word indicator", section: "8.4.1", page: 90}
      - {rule: "what terminates it", section: "8.4.2", page: 90}
      - {rule: "letters-sequence: alphabetic signs bounded by non-alphabetic signs, including space", section: "2.1", page: 8}
      - {rule: "non-alphabetic: any symbol, including space, that is not a letter, modified letter, ligatured letter or contraction", section: "2.1", page: 8}
    non_alphabetic_examples_in_rulebook:
      - {sign: hyphen, example: ANGLO-SAXON, section: "8.4.2", page: 91}
      - {sign: apostrophe, example: "DON'T", section: "8.4.2", page: 91}
      - {sign: full stop, example: HOTELS.COM, section: "8.4.2", page: 91}
      - {sign: parenthesis, example: BA(Oxon), section: "8.4.2", page: 92}
      - {sign: commercial at, example: McDONALD@xyz.com, section: "8.4.2", page: 92}
      - {sign: numeric indicator, example: 1-800-SLEEP88, section: "6.7.1", page: 71}
    derived:
      - >-
        Grade 1 indicators are non-alphabetic by the 2.1 definition, so one inside a capitalised word
        ends it. The rulebook shows no such example, because 5.8.1 places a grade 1 indicator before
        the capitals indicator.
  capitalised_passage:
    scope: >-
      The next passage: three or more symbols-sequences, which may include non-alphabetic symbols.
      Spaces, punctuation and numbers do not end it.
    terminated_by: [the capitals terminator immediately after the last affected symbols-sequence]
    refs:
      - {rule: "scope of the capitalised passage indicator", section: "8.5.1", page: 93}
      - {rule: "a passage is three or more symbols-sequences and may include non-alphabetic symbols", section: "8.5.2", page: 93}
      - {rule: "terminated by the capitals terminator", section: "8.5.3", page: 93}
      - {rule: "across several text elements, each element starts with the passage indicator; only the last is terminated", section: "8.5.5", page: 94}
  capitals_terminator:
    rule: >-
      Placed after the final capitalised letter, within or after the symbols-sequence; it ends
      capitalised word mode or capitalised passage mode, including in the middle of a symbols-sequence.
    refs:
      - {rule: "placement of the terminator", section: "8.6.1", page: 96}
      - {rule: "may precede or follow punctuation and other terminators", section: "8.6.2", page: 96}
      - {rule: "terminating before the end of a symbols-sequence", section: "8.6.3", page: 96}
  interactions:
    - {rule: "A grade 1 indicator precedes a capitals indicator (⠰⠠⠭, ⠰⠠⠠⠉⠙).", section: "5.8.1", page: 61}
    - {rule: "A capital letter after a digit needs no grade 1 indicator (3B is ⠼⠉⠠⠃); the prefix ends numeric mode.", section: "6.5.2", page: 68}
    - {rule: "Capitals indicators are among the symbols that may come between a space, hyphen or dash and the start of a word, so they do not change whether the next sign begins a word.", section: "2.6.2", page: 16}
    - {rule: "Capitals placement: the indicator goes immediately before the first capitalised letter or its modifier.", section: "8.7.1", page: 97}
  not_applicable_to_input:
    - {rule: "Capitalised words divided at a braille line end (8.4.3, 8.4.4) concern transcribed line layout.", section: "8.4.3", page: 92}
    - {rule: "Choosing between single capitals and word mode (8.8) is transcriber guidance; both read the same.", section: "8.8", page: 98}
    - {rule: "Modifiers and ligatures inside a capitalised word (8.3.3, 8.4.2, 8.9) apply to accented letters, which ueb1 excludes.", section: "8.9", page: 99}

transitions:
  state: {caps: [none, word, passage]}
  initial: none
  rules:
    - {when: any, input: "⠠ + letter", output: uppercase letter, caps: "word -> none; passage stays", ref: "8.3.1, 8.4.2"}
    - {when: "caps word or passage", input: letter, output: uppercase letter, caps: unchanged, ref: "8.4.1, 8.5.1"}
    - {when: caps none, input: letter, output: lowercase letter, caps: unchanged}
    - {when: any, input: "⠠⠠", output: none, caps: "none -> word; word stays; passage stays", ref: "8.4.1"}
    - {when: any, input: "⠠⠠⠠", output: none, caps: passage, ref: "8.5.1, 8.5.5"}
    - {when: any, input: "⠠⠄", output: none, caps: none, ref: "8.6.1, 8.6.3"}
    - {when: caps word, input: "space or any non-alphabetic sign (punctuation, hyphen, apostrophe, numeric indicator, grade 1 indicator)", output: "the sign's normal meaning", caps: none, ref: "8.4.2"}
    - {when: caps passage, input: "space or any non-alphabetic sign", output: "the sign's normal meaning", caps: passage, ref: "8.5.2"}
    - {when: any, input: "⠠ followed by a cell that is not a letter and forms no other sign", output: none, caps: unchanged, note: "incomplete prefix under the shared pending-input policy"}
  other_signs_starting_with_dot_6: "⠠⠦ and ⠠⠴ (single quotes) and ⠠⠶ (nondirectional double quote) are separate signs, not capitals; see ueb-literary-signs.yaml."

firmware_choices:
  - choice: ⠠⠄ with no capitals mode in effect produces no output and changes nothing.
    reason: The rulebook only places the terminator after capitals; it defines no other meaning for ⠠⠄.
  - choice: ⠠⠠ inside a capitalised passage leaves the passage in effect.
    reason: The rulebook gives no rule for a word indicator inside a passage; only the terminator ends a passage (8.5.3).
  - choice: A context reset (any layer change, non-Braille key, mode change, command action or settings entry) ends every capitals mode.
    reason: >-
      Root plan 4.5.4. It agrees with 8.5.5, which restarts a passage at each new text element with
      its own passage indicator.
  - choice: Uppercase output is the letter key with Shift, whatever the capitals mode.
    reason: Host output is ordinary keystrokes (root plan 4.4.2).

