# SPDX-License-Identifier: MIT
# Phase 02 source audit. This is the verified subset, not a claim of complete
# MacBook key coverage. Each selected chord is identical in ueb1/computer8;
# separate compiled command tables allow later mode-specific decisions.
verified_on: 2026-10-18
modes: [ueb1, computer8]
priority: [voiceover_mac, talkback, hable]
sources:
  voiceover_mac:
    product: macOS VoiceOver
    title: Common braille commands for VoiceOver on Mac
    url: https://support.apple.com/en-us/103560
    published: 2024-10-09
    sections: [Navigation, Scrolling, Interaction, Editing, Braille, 8-dot]
    verification: Full article read, including its 8-dot table; not search snippets.
  talkback:
    product: Android TalkBack
    title: Use braille keystrokes
    url: https://support.google.com/accessibility/android/answer/3535886?hl=en
    verification: Full article read; only Play or pause media is selected below.
  hable:
    product: Hable One
    urls:
      - https://www.iamhable.com/en-am/pages/hable-one-ios-manual
      - https://www.iamhable.com/en-am/pages/hable-one-android-manual
    verification: Both manuals, including full function lists, read.
  voiceover_ios:
    product: iOS VoiceOver
    title: Common braille commands for VoiceOver on your iPhone, iPad, and iPod touch
    url: https://support.apple.com/en-us/118665
    verification: Full article read to audit the candidate catalog; not the specified fallback after Mac.
  zmk:
    reference: references/research/zmk-globe-fn-and-media-actions.yaml
    note: Binding support is not evidence of a Braille chord assignment.

notation:
  inputs: Ordered chords; integers 1..8 are dots, space is the Braille-space key.
  mask: Dot n is bit n-1; Braille space is bit 8 (0x100).
  six_dot_modes: >-
    Common six-dot commands are used in both tables. The Mac article's 8-dot
    keyboard commands are also available in ueb1: the physical dot 7/8 keys
    remain reachable, and the task explicitly requires their Delete/Return
    aliases and default sticky-modifier chords in every character mode.
  host_translation: >-
    These rules emit ordinary keyboard/consumer usages, not VoiceOver API
    commands. Previous/next item use raw Left/Right as the candidate catalog
    requests; host focus movement depends on VoiceOver/Quick Nav and app state.
    Home/End are first/last-item analogues, not macOS line-start/end shortcuts.
    Actual line start/end compose sticky Command then Left/Right.

# This list is also an independent executable expectation for host rule tests.
commands:
  - {name: literal-space, inputs: [[space]], masks: [0x100], binding: "&kp SPACE", class: space, source: project, section: "root 4.5 and space/navigation leaf: literal Braille space"}
  - {name: previous-item-left, inputs: [[space, 1]], masks: [0x101], binding: "&kp LEFT_ARROW", source: voiceover_mac, section: Navigation}
  - {name: next-item-right, inputs: [[space, 4]], masks: [0x108], binding: "&kp RIGHT_ARROW", source: voiceover_mac, section: Navigation}
  - {name: up, inputs: [[space, 3]], masks: [0x104], binding: "&kp UP_ARROW", source: voiceover_mac, section: Navigation}
  - {name: down, inputs: [[space, 6]], masks: [0x120], binding: "&kp DOWN_ARROW", source: voiceover_mac, section: Navigation}
  - {name: first-item-home, inputs: [[space, 1, 2, 3]], masks: [0x107], binding: "&kp HOME", source: voiceover_mac, section: Navigation}
  - {name: last-item-end, inputs: [[space, 4, 5, 6]], masks: [0x138], binding: "&kp END", source: voiceover_mac, section: Navigation}
  - {name: page-up, inputs: [[space, 3, 4, 5, 6]], masks: [0x13c], binding: "&kp PAGE_UP", source: voiceover_mac, section: Scrolling}
  - {name: page-down, inputs: [[space, 1, 4, 5, 6]], masks: [0x139], binding: "&kp PAGE_DOWN", source: voiceover_mac, section: Scrolling}
  - {name: tab, inputs: [[space, 2, 3, 4, 5]], masks: [0x11e], binding: "&kp TAB", source: voiceover_mac, section: Braille}
  - {name: return, inputs: [[space, 1, 5]], masks: [0x111], binding: "&kp RETURN", source: voiceover_mac, section: Braille}
  - {name: escape, inputs: [[space, 1, 2]], masks: [0x103], binding: "&kp ESC", source: voiceover_mac, section: Navigation}
  - {name: delete, inputs: [[space, 1, 4, 5]], masks: [0x119], binding: "&kp BSPC", source: voiceover_mac, section: Braille}
  - {name: delete-dot7, inputs: [[7]], masks: [0x040], binding: "&kp BSPC", source: voiceover_mac, section: 8-dot}
  - {name: delete-space7, inputs: [[space, 7]], masks: [0x140], binding: "&kp BSPC", source: voiceover_mac, section: 8-dot}
  - {name: return-dot8, inputs: [[8]], masks: [0x080], binding: "&kp RETURN", source: voiceover_mac, section: 8-dot}
  - {name: return-space8, inputs: [[space, 8]], masks: [0x180], binding: "&kp RETURN", source: voiceover_mac, section: 8-dot}
  - {name: shift, inputs: [[space, 4, 7]], masks: [0x148], binding: "&sk LSHFT", source: voiceover_mac, section: 8-dot}
  - {name: control, inputs: [[space, 3, 7]], masks: [0x144], binding: "&sk LCTRL", source: voiceover_mac, section: 8-dot}
  - {name: option, inputs: [[space, 2, 7]], masks: [0x142], binding: "&sk LALT", source: voiceover_mac, section: 8-dot}
  - {name: command, inputs: [[space, 1, 7]], masks: [0x141], binding: "&sk LGUI", source: voiceover_mac, section: 8-dot}
  - name: globe
    inputs: [[space, 5, 7]]
    masks: [0x150]
    binding: "&sk GLOBE"
    source: voiceover_mac
    section: 8-dot
    adaptation: >-
      Mac calls this the Fn chord. The project's required supported-action
      policy substitutes Consumer GLOBE at this position, NOT a true Fn key.
      This does not implement Fn+Delete, Fn+arrows or Fn+F-keys.
  - {name: volume-down, inputs: [[space, 1, 2, 6]], masks: [0x123], binding: "&kp C_VOL_DN", source: voiceover_mac, section: Interaction}
  - {name: volume-up, inputs: [[space, 3, 4, 5]], masks: [0x11c], binding: "&kp C_VOL_UP", source: voiceover_mac, section: Interaction}
  - {name: play-pause, inputs: [[space, 7, 8]], masks: [0x1c0], binding: "&kp C_PP", source: talkback, section: TalkBack features}

compositions:
  - {name: line-start, inputs: [[space, 1, 7], [space, 1]], outputs: ["Command+Left Arrow"], source: voiceover_mac}
  - {name: line-end, inputs: [[space, 1, 7], [space, 4]], outputs: ["Command+Right Arrow"], source: voiceover_mac}
  - {name: previous-ui-element, inputs: [[space, 4, 7], [space, 2, 3, 4, 5]], outputs: ["Shift+Tab"], source: voiceover_mac}
  - {name: next-ui-element, inputs: [[space, 2, 3, 4, 5]], outputs: [Tab], source: voiceover_mac}

conflicts_and_resolutions:
  - mode: ueb1
    result: All selected space-bearing commands are outside dot-only literary cells.
    dot_only: Dot 7/8 are outside the six-dot alphabet/sign space; keep as commands.
  - mode: computer8
    result: >-
      Dot 7 (0x40) and dot 8 (0x80) are not printable rows in the planned
      liblouis en-us-comp8 mapping. Reserve them for Delete/Return, never
      duplicate them with no-output character rules. Space-bearing commands
      cannot collide with any dot-only eight-dot row. Phase 03 must recheck
      the actual character table with the existing factory validator.
  - candidate: fixture Tab at 0x118 (space+dots 4,5)
    resolution: Remove; Mac assigns Translate here. Only 0x11e is factory Tab.
  - candidate: fixture Left/Right at space+3/space+6
    resolution: Replace with Up/Down; Left/Right are space+1/space+4.
  - candidate: Mac 8-dot toggle modifiers (space+dot8+modifier dot)
    resolution: Do not install; held/toggle lifecycle is not the required sticky-key action.
  - candidate: candidate Fn+Left and Fn+Delete tests
    resolution: Not Globe equivalents. Keep as unimplemented candidate tests, not passing acceptance.
  - candidate: iOS editing shortcuts (copy, cut, paste, undo, redo, Shift-Tab)
    resolution: >-
      Not present as defaults in the Mac article. Hable has duration-sensitive
      counterparts but this detector has no duration distinction; adding
      space or converting a long press to a short chord requires a policy
      decision. Do not silently promote the candidate catalog to factory data.
  - candidate: Hable CapsLock (three successive dot6 prefixes)
    resolution: >-
      A text-capitalisation mode, not an ordinary host Caps Lock key, and it
      collides with UEB capitals-passage syntax. Do not map to &kp CAPS.
  - candidate: Hable Spotlight (hold dots1,6) and Mute Phone (hold dots1,3,4)
    resolution: >-
      Duration-sensitive dot-only actions conflict with literary input and
      cannot be represented by the release-terminated mask detector without
      remapping. No new timer or arbitrary space-bit adaptation is authorized.

unassigned_required_actions:
  # No exact representable default found in the specified source hierarchy.
  # Supported HID bindings below do NOT supply a sourced chord by themselves.
  - {name: caps-lock, binding: "&kp CAPS", reason: "Hable text CapsLock is not host Caps Lock; conflicts with literary capitals"}
  - {name: function-keys, bindings: "&kp F1 .. &kp F12", reason: "No dot-chord defaults in the Mac, TalkBack or Hable documents read"}
  - {name: brightness-down, binding: "&kp C_BRI_DN", reason: "No dot-chord default found"}
  - {name: brightness-up, binding: "&kp C_BRI_UP", reason: "No dot-chord default found"}
  - {name: mission-control, binding: "&kp C_AC_DESKTOP_SHOW_ALL_WINDOWS", reason: "No dot-chord default found"}
  - {name: spotlight, binding: "&kp C_AC_SEARCH", reason: "Hable long-press dots1,6 needs an approved remapping"}
  - {name: previous-track, binding: "&kp C_PREV", reason: "No dot-chord default found"}
  - {name: next-track, binding: "&kp C_NEXT", reason: "No dot-chord default found"}
  - {name: mute, binding: "&kp C_MUTE", reason: "Hable Android long-press dots1,3,4 needs an approved remapping; Mac speech mute is not system mute"}

limitations:
  - Settings-entry chord is intentionally deferred to Phase 05.
  - True Fn, Dictation/Siri, Do Not Disturb, Touch ID and power have no factory action.
  - GLOBE is host-dependent and is not Fn; macOS BLE acceptance is user-owned.
  - Sticky keys inherit the user's &sk settings (ZMK default timeout 1000 ms).
  - FULL consumer usages are the ZMK default; BASIC cannot send Globe, Spotlight or Mission Control.
  - The optional ueb2 command table may reuse these rows; it does not implement Grade 2 text.
