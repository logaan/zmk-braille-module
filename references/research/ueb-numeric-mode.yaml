# UEB numeric mode: entry, continuation, termination and resumption for ueb1.
# Research record for the Braille module plan (phase 03 Grade 1 literary input).

question: >-
  When does UEB numeric mode begin, continue, terminate or resume, and how does it interact
  with punctuation and letters, according to the pinned ICEB rulebook?

source:
  rulebook: references/iceb/rules-of-unified-english-braille-2024.pdf
  edition: The Rules of Unified English Braille, Third Edition 2024 (ICEB)
  page: printed page number; the PDF page is the printed page + 28
  verified: >-
    Dot patterns are decoded from the rulebook's braille characters; every rulebook fixture was
    back-translated with a reference model of the transitions below and reproduces the rulebook's
    print exactly.

conventions:
  dots: list of cells in order; each cell lists its raised dots (1-6); [] is the Braille space chord
  braille: Unicode braille of the same cells, for reading only

related:
  literary_signs: references/research/ueb-literary-signs.yaml
  grade_1_indicators: references/research/ueb-grade-1-indicators.yaml
  capitalisation: references/research/ueb-capitalisation.yaml
  context_representation: references/research/ueb-indicator-context.yaml

normative:
  numeric_indicators:
    summary: >-
      The ten digits and the two decimal signs, each written with the numeric prefix, are the
      numeric indicators. A numeric indicator sets numeric mode for the rest of the symbols-sequence.
    refs:
      - {rule: "numeric indicator list", section: "6.1", page: 65}
      - {rule: "numeric indicators set numeric mode for the remainder of the symbols-sequence", section: "6.1.1", page: 65}
    signs:
      - {braille: "⠼⠁", dots: [[3, 4, 5, 6], [1]], print: "1"}
      - {braille: "⠼⠃", dots: [[3, 4, 5, 6], [1, 2]], print: "2"}
      - {braille: "⠼⠉", dots: [[3, 4, 5, 6], [1, 4]], print: "3"}
      - {braille: "⠼⠙", dots: [[3, 4, 5, 6], [1, 4, 5]], print: "4"}
      - {braille: "⠼⠑", dots: [[3, 4, 5, 6], [1, 5]], print: "5"}
      - {braille: "⠼⠋", dots: [[3, 4, 5, 6], [1, 2, 4]], print: "6"}
      - {braille: "⠼⠛", dots: [[3, 4, 5, 6], [1, 2, 4, 5]], print: "7"}
      - {braille: "⠼⠓", dots: [[3, 4, 5, 6], [1, 2, 5]], print: "8"}
      - {braille: "⠼⠊", dots: [[3, 4, 5, 6], [2, 4]], print: "9"}
      - {braille: "⠼⠚", dots: [[3, 4, 5, 6], [2, 4, 5]], print: "0"}
      - {braille: "⠼⠂", dots: [[3, 4, 5, 6], [2]], print: ","}
      - {braille: "⠼⠲", dots: [[3, 4, 5, 6], [2, 5, 6]], print: "."}
  numeric_mode_symbols:
    summary: Only these symbols occur in numeric mode; each leaves numeric mode in effect.
    refs:
      - {rule: "numeric mode symbols", section: "6.2.1", page: 66}
      - {rule: "digit and numeric-space meanings (in numeric mode only)", section: "6", page: 65}
    in_ueb1:
      - {braille: "⠁", dots: [[1]], print: "1", name: "a-j are the digits 1-9 and 0"}
      - {braille: "⠃", dots: [[1, 2]], print: "2"}
      - {braille: "⠉", dots: [[1, 4]], print: "3"}
      - {braille: "⠙", dots: [[1, 4, 5]], print: "4"}
      - {braille: "⠑", dots: [[1, 5]], print: "5"}
      - {braille: "⠋", dots: [[1, 2, 4]], print: "6"}
      - {braille: "⠛", dots: [[1, 2, 4, 5]], print: "7"}
      - {braille: "⠓", dots: [[1, 2, 5]], print: "8"}
      - {braille: "⠊", dots: [[2, 4]], print: "9"}
      - {braille: "⠚", dots: [[2, 4, 5]], print: "0"}
      - {braille: "⠂", dots: [[2]], print: ",", name: "comma"}
      - {braille: "⠲", dots: [[2, 5, 6]], print: ".", name: "full stop (period, decimal point)"}
      - {braille: "⠐⠁", dots: [[5], [1]], print: " 1", name: "numeric space and following digit (6.6.1)"}
      - {braille: "⠐⠃", dots: [[5], [1, 2]], print: " 2", name: "numeric space and following digit (6.6.1)"}
      - {braille: "⠐⠉", dots: [[5], [1, 4]], print: " 3", name: "numeric space and following digit (6.6.1)"}
      - {braille: "⠐⠙", dots: [[5], [1, 4, 5]], print: " 4", name: "numeric space and following digit (6.6.1)"}
      - {braille: "⠐⠑", dots: [[5], [1, 5]], print: " 5", name: "numeric space and following digit (6.6.1)"}
      - {braille: "⠐⠋", dots: [[5], [1, 2, 4]], print: " 6", name: "numeric space and following digit (6.6.1)"}
      - {braille: "⠐⠛", dots: [[5], [1, 2, 4, 5]], print: " 7", name: "numeric space and following digit (6.6.1)"}
      - {braille: "⠐⠓", dots: [[5], [1, 2, 5]], print: " 8", name: "numeric space and following digit (6.6.1)"}
      - {braille: "⠐⠊", dots: [[5], [2, 4]], print: " 9", name: "numeric space and following digit (6.6.1)"}
      - {braille: "⠐⠚", dots: [[5], [2, 4, 5]], print: " 0", name: "numeric space and following digit (6.6.1)"}
    excluded_from_ueb1:
      - {braille: "⠬", dots: [[3, 4, 6]], name: "visible space: counted spaces and omitted digits (technical, GTM 1.8)", ref: {section: "6.2.1", page: 66}}
      - {braille: "⠌", dots: [[3, 4]], name: "simple numeric fraction line: prints a built-up fraction such as ⅜, not a keyboard character (11.3)", ref: {section: "6.2.1", page: 66}}
      - {braille: "⠐", dots: [[5]], name: "line continuation indicator: braille line layout only", ref: {section: "6.10.3", page: 72}}
      - {braille: "⠐⠐", dots: [[5], [5]], name: "line continuation indicator with space: braille line layout only", ref: {section: "6.10.4", page: 72}}
  termination:
    rule: A space, or any symbol not listed in 6.2.1, terminates numeric mode.
    refs:
      - {rule: "termination of numeric mode", section: "6.3.1", page: 67}
    consequences:
      - "Letters k-z, capital letters (⠠ prefix), the grade 1 indicator, hyphen, colon, solidus, parentheses and every other non-6.2.1 sign terminate numeric mode, and are read with numeric mode off (6.3.1, 6.5.2)."
      - "The terminating sign is itself interpreted normally: 3m is ⠼⠉⠍, 3B is ⠼⠉⠠⠃ (6.5.2)."
  resumption:
    rule: >-
      Numeric mode never resumes on its own. After it terminates, digits need a new numeric
      indicator, even within the same symbols-sequence (7:30 is ⠼⠛⠒⠼⠉⠚, 9-10 is ⠼⠊⠤⠼⠁⠚).
    refs:
      - {rule: "examples of re-entry after termination", section: "6.3.1", page: 67}
  letters_after_numbers:
    rule: >-
      A lowercase letter a-j directly after a digit, full stop or comma in numeric mode is preceded
      by the grade 1 symbol indicator (⠰), which terminates numeric mode. Letters k-z and capital
      letters need no indicator.
    refs:
      - {rule: "grade 1 indicator only before a-j after a digit, full stop or comma", section: "6.5.2", page: 68}
      - {rule: "in grade 1 text, grade 1 indicators appear for a-j after digits", section: "5.11.1", page: 63}
  grade_1_mode_set_by_numeric_indicator:
    rule: >-
      A numeric indicator also sets grade 1 mode, terminated by a space, hyphen, dash or grade 1
      terminator; while it lasts, contractions may not follow a number.
    refs:
      - {rule: "numeric indicator sets grade 1 mode", section: "5.6.1", page: 59}
      - {rule: "terminated by space, hyphen, dash or grade 1 terminator", section: "6.5.1", page: 68}
      - {rule: "contractions may not follow a number", section: "6.5.3", page: 68}
    in_ueb1: No output effect, because uncontracted input has no contractions.
  full_stop_before_number:
    rule: A full stop followed by a number precedes the numeric indicator unless it is a decimal point.
    refs:
      - {rule: "placement of numeric prefix with full stop", section: "6.4.1", page: 67}
    in_ueb1: Reading needs no special rule; ⠲ outside numeric mode is a full stop and ⠼⠲ is a decimal point.
  excluded_devices:
    summary: Spatial and technical devices outside keyboard input; ueb1 has no rule for them.
    items:
      - {braille: "⠼", dots: [[3, 4, 5, 6]], name: "spaced numeric indicator: spatial arithmetic", ref: {section: "6.8.1", page: 71}}
      - {braille: "⠼⠼", dots: [[3, 4, 5, 6], [3, 4, 5, 6]], name: "numeric passage indicator: long worked examples and numeric tables", ref: {section: "6.9.1", page: 72}}
      - {braille: "⠼⠄", dots: [[3, 4, 5, 6], [3]], name: "numeric passage terminator", ref: {section: "6.9.2", page: 72}}

transitions:
  state: {numeric: ["off", "on"]}
  initial: "off"
  rules:
    - {when: any, input: "⠼ followed by a-j, ⠂ or ⠲", output: "digit, comma or full stop", numeric: "on", ref: "6.1.1"}
    - {when: "numeric on", input: a-j, output: "digit 1-9, 0", numeric: "on", ref: "6.2.1"}
    - {when: "numeric on", input: "⠂ or ⠲", output: "comma or full stop", numeric: "on", ref: "6.2.1"}
    - {when: "numeric on", input: "⠐ followed by a-j", output: "space then digit", numeric: "on", ref: "6.6.1"}
    - {when: "numeric on", input: "space or any other sign", output: "the sign's normal meaning", numeric: "off", ref: "6.3.1"}
    - {when: any, input: "⠼ followed by a cell that forms no numeric indicator", output: none, numeric: unchanged, note: "incomplete prefix under the shared pending-input policy"}

firmware_choices:
  - choice: The spaced numeric indicator, numeric passage, line continuation, visible space and simple fraction line have no ueb1 rules.
    reason: >-
      They lay out spatial or technical material (6.8-6.10, GTM) and print nothing on the US
      keyboard; phase 03 limits literary work to keyboard input, not a technical-notation translator.
  - choice: Grade 1 mode set by a numeric indicator is not tracked in the initial modes.
    reason: It only forbids contractions (6.5.3); ueb1 has none.

