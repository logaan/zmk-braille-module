# UEB Grade 2 word and word-part boundaries: where contractions may be read, for ueb2.
# Research record for the Braille module plan (phase 07 UEB Grade 2 extension).

question: >-
  What counts as a word, as standing alone, and as a word part for UEB contractions; where does
  the pinned rulebook permit or forbid each contraction; and what does a back-translator need to
  decide the meaning of a buffered word, including cells that read as contracted or uncontracted?

source:
  rulebook: references/iceb/rules-of-unified-english-braille-2024.pdf
  edition: The Rules of Unified English Braille, Third Edition 2024 (ICEB)
  page: printed page number; the PDF page is the printed page + 28
  verified: >-
    Dot patterns are decoded from the rulebook's braille characters, each checked against its
    rendered glyph. A reference back-translator that applies exactly the conditions and procedure
    below reproduces every in-scope Section 10 example (1,489) and 1,038 of the 1,043 Appendix 2
    words; the exceptions are listed in ueb-grade2-contractions.yaml. Every fixture below is a
    rulebook example it reproduces.

conventions:
  dots: list of cells in order; each cell lists its raised dots (1-6); [] is the Braille space chord
  braille: Unicode braille of the same cells, for reading only; dots is authoritative
  print: host output as US-layout keystrokes; curly quotes print as straight quotes (ueb-literary-signs.yaml)

related:
  contractions: references/research/ueb-grade2-contractions.yaml
  indicator_interactions: references/research/ueb-grade2-indicator-interactions.yaml
  context_representation: references/research/ueb-indicator-context.yaml
  ueb1_signs: references/research/ueb-literary-signs.yaml

normative:
  terms:
    - {term: "symbols-sequence", definition: "an unbroken string of braille signs, alphabetic or not, preceded and followed by space; also called a symbols-word", ref: {section: "2.1", page: 8}}
    - {term: "letters-sequence", definition: "an unbroken string of alphabetic signs preceded and followed by non-alphabetic signs, including space", ref: {section: "2.1", page: 8}}
    - {term: "alphabetic", definition: "letters, including modified letters, ligatured letters and contractions", ref: {section: "2.1", page: 7}}
    - {term: "non-alphabetic", definition: "any symbol, including the space, that is not a letter, modified letter, ligatured letter or contraction", ref: {section: "2.1", page: 8}}
    - {term: "braille space", definition: "a blank cell, or the blank margin at the beginning and end of a braille line", ref: {section: "2.1", page: 7}}
    - {term: "beginning of a word", definition: "the letters-sequence which follows a space, hyphen or dash and which may be preceded by the 2.6.2 punctuation and indicator symbols", ref: {section: "10.4.3", page: 122}}
    - {term: "standing alone", definition: "unaccompanied by additional letters, symbols or punctuation except as 2.6 specifies; it decides when a sign is read as a contraction", ref: {section: "2.1", page: 8}}
  reader_decides_by:
    rule: >-
      The reader determines a sign's meaning by its spacing, by the standing-alone rule, by its
      position relative to other signs, and by the mode in effect.
    ref: {section: "2.4.3", page: 12}
  standing_alone:
    rule: >-
      A letter or letters-sequence stands alone when it is preceded and followed by a space, a
      hyphen or a dash (of any length). Only the symbols listed below may intervene between it and
      that space, hyphen or dash; any other symbol, such as / . _ @ digits or a letter, means it
      does not stand alone.
    refs: [{section: "2.6.1", page: 15}, {section: "2.6.2", page: 16}, {section: "2.6.3", page: 17}]
    before_2_6_2:
      - opening parenthesis, square bracket or curly bracket
      - opening quotation mark of any kind
      - nondirectional quotation mark of any kind
      - apostrophe
      - opening typeform indicator of any kind
      - capitals indicator of any kind (⠠ ⠠⠠ ⠠⠠⠠)
      - opening transcriber's note indicator
      - any combination of these
    after_2_6_3:
      - comma, semicolon, colon, full stop, ellipsis, exclamation mark or question mark
      - closing parenthesis, square bracket or curly bracket
      - closing quotation mark of any kind
      - nondirectional quotation mark of any kind
      - apostrophe
      - typeform terminator of any kind
      - capitals terminator (⠠⠄)
      - closing transcriber's note indicator
      - line indicator
      - any combination of these
    not_intervening: "Any other sign breaks standing alone, for example a grade 1 indicator, <, /, *, &, #, ~, a digit, or letters after a full stop (this/that, but...not, <x, y>)."
    whole_word_cases_2_6_4:
      - {rule: "A word with an interior apostrophe stands alone as a whole: an alphabetic or strong wordsign followed by 'd 'll 're 's 't or 've, a shortform with 's, or a word on the Shortforms List (could've, mustn't).", refs: [{section: "2.6.4", page: 18}, {section: "10.1.2", page: 115}, {section: "10.2.2", page: 117}, {section: "10.9.5", page: 151}]}
      - {rule: "A word with an interior capitals indicator or terminator stands alone as a whole when it meets 10.9.4.", refs: [{section: "2.6.4", page: 19}, {section: "10.9.4", page: 150}]}
      - {rule: "A word listed on the Shortforms List with an interior indicator (DeafBlind) stands alone in that format.", refs: [{section: "2.6.4", page: 19}]}
    non_alphabetic_2_6_5: {rule: "A non-alphabetic symbol stands alone under the same provisions; a standing-alone question mark or quotation mark needs a grade 1 indicator.", refs: [{section: "2.6.5", page: 19}, {section: "7.5.3", page: 81}, {section: "7.6.8", page: 85}, {section: "7.6.10", page: 86}]}
  word_parts:
    summary: >-
      Groupsigns stand for part of a word. Their conditions look only at the neighbouring signs:
      a capitals indicator or terminator next to the letters breaks the condition.
    after_alphabetic:
      rule: The letters follow a letter, a contraction, a modified letter or a ligatured letter, and not a capitals indicator or capitals terminator.
      refs: [{section: "10.8.1", page: 143}, {section: "10.8.2", page: 144}, {section: "10.6.5", page: 129}, {section: "10.6.6", page: 131}]
    before_alphabetic:
      rule: The letters are followed by a letter, a contraction, a modified letter or a ligatured letter, and not by a capitals indicator or capitals terminator (a capital letter's dot-6 prefix counts as a capitals indicator).
      refs: [{section: "10.6.2", page: 128}, {section: "10.6.3", page: 128}, {section: "10.6.5", page: 129}, {section: "10.6.6", page: 131}]
    lower_punctuation_contact:
      rule: >-
        be, were, his and was are not read as wordsigns when in contact with punctuation that has
        only lower dots, including the hyphen and dash; every quotation mark counts as lower.
        Contact means the immediately neighbouring sign; capitals indicators and terminators are
        disregarded, but any other sign between (such as a typeform indicator) breaks contact.
      refs: [{section: "10.5.1", page: 123}, {section: "7.6.8", page: 85}]
      lower_punctuation: ["⠂ comma", "⠆ semicolon", "⠒ colon", "⠲ full stop", "⠖ exclamation mark", "⠦ question mark", "⠄ apostrophe", "⠤ hyphen", "⠠⠤ dash", "⠐⠠⠤ long dash", "any quotation mark: ⠦ ⠴ ⠘⠦ ⠘⠴ ⠠⠦ ⠠⠴ ⠠⠶ ⠄ ⠸⠦ ⠸⠴"]
  conditions:
    summary: Named conditions used by the reading rules below; each is decided within one symbols-sequence.
    grade1-off: "Grade 1 mode is not in effect (ueb-grade2-indicator-interactions.yaml); in grade 1 mode no contraction is read."
    standing-alone: "The sign, with any capital prefix, is a letters-sequence of its own under 2.6.1-2.6.3, allowing the 2.6.4 apostrophe endings where the class permits them."
    word-start: "The sign begins a word: the context field word_start is true (ueb-indicator-context.yaml)."
    after-alphabetic: "word_parts.after_alphabetic holds."
    before-alphabetic: "word_parts.before_alphabetic holds; a following ⠂ ⠆ ⠒ ⠖ ⠶ counts as alphabetic only if it is itself between alphabetic signs."
    no-lower-contact: "word_parts.lower_punctuation_contact does not apply."
    shortform-word: "The shortform qualifies inside a longer standing-alone word under 10.9.2-10.9.5 (see shortform_words)."
  reading_rules:
    summary: >-
      What each contraction cell means when grade1-off holds, with the reading that applies when
      its condition fails. Rows with the same cells have disjoint conditions. Entries are in
      ueb-grade2-contractions.yaml.
    rows:
      - {cells: "⠃ ⠉ ⠙ ⠑ ⠋ ⠛ ⠓ ⠚ ⠅ ⠇ ⠍ ⠝ ⠏ ⠟ ⠗ ⠎ ⠞ ⠥ ⠧ ⠭ ⠽ ⠵ ⠺", reading: "alphabetic wordsign", when: "standing-alone, apostrophe endings allowed", otherwise: "the letter", refs: [{section: "10.1.1", page: 113}, {section: "10.1.2", page: 115}]}
      - {cells: "⠡ ⠩ ⠹ ⠱ ⠳ ⠌", reading: "strong wordsign", when: "standing-alone, apostrophe endings allowed", otherwise: "the strong groupsign ch sh th wh ou st", refs: [{section: "10.2.1", page: 116}, {section: "10.2.2", page: 117}]}
      - {cells: "⠯ ⠿ ⠷ ⠮ ⠾", reading: "strong contraction", when: "always", refs: [{section: "10.3.1", page: 118}]}
      - {cells: "⠣ ⠫ ⠻ ⠪ ⠬ ⠜", reading: "strong groupsign", when: "always", refs: [{section: "10.4.1", page: 119}]}
      - {cells: "⠆ ⠶ ⠦ ⠴, and with the capital prefix ⠠⠆ ⠠⠶ ⠠⠦ ⠠⠴", reading: "lower wordsign be were his was", when: "standing-alone and no-lower-contact", otherwise: "the rows below; ⠦ an opening double quote at word-start, else a question mark; ⠴ a closing double quote; ⠠⠦ ⠠⠴ ⠠⠶ single or nondirectional quotes", refs: [{section: "10.5.1", page: 123}, {section: "7.6.8", page: 85}, {section: "7.6.10", page: 86}]}
      - {cells: "⠢", reading: "lower wordsign enough", when: "standing-alone, also enough's", otherwise: "the lower groupsign en", refs: [{section: "10.5.2", page: 124}, {section: "10.6.9", page: 133}]}
      - {cells: "⠔", reading: "lower wordsign or groupsign in", when: "always", refs: [{section: "10.5.3", page: 125}, {section: "10.6.8", page: 132}]}
      - {cells: "⠆ ⠒ ⠲", reading: "lower groupsign be con dis", when: "word-start and before-alphabetic", otherwise: "the rows below, else semicolon, colon, full stop", refs: [{section: "10.6.2", page: 128}, {section: "10.6.3", page: 128}]}
      - {cells: "⠂ ⠆ ⠒ ⠖ ⠶", reading: "lower groupsign ea bb cc ff gg", when: "after-alphabetic and before-alphabetic", otherwise: "comma, semicolon, colon, exclamation mark; ⠶ has no other literary reading", refs: [{section: "10.6.5", page: 129}, {section: "10.6.6", page: 131}]}
      - {cells: "⠘ ⠸ ⠐ followed by the listed cell", reading: "initial-letter contraction", when: "always", refs: [{section: "10.7.1", page: 135}]}
      - {cells: "⠨ ⠰ followed by the listed cell", reading: "final-letter groupsign", when: "after-alphabetic", otherwise: "⠰ is the grade 1 symbol indicator; ⠨ with a letter is a Greek letter, outside ueb1", refs: [{section: "10.8.1", page: 143}, {section: "10.8.2", page: 144}, {section: "2.4.2", page: 12}]}
      - {cells: "shortform cells", reading: "shortform", when: "standing-alone, s or 's allowed, or shortform-word", otherwise: "the letters and other contractions", refs: [{section: "10.9.1", page: 146}, {section: "10.9.2", page: 147}, {section: "10.9.5", page: 151}]}
    precedence: >-
      Grade 1 and capitals indicators and numeric mode are read first (the ueb1 context rules);
      then, with grade1-off, the longest contraction whose condition holds; then the ueb1 meaning.
      A ⠰ directly after an alphabetic sign and before e g l n s t or y is the final-letter
      groupsign, not the grade 1 indicator.
  shortform_words:
    procedure:
      - {step: "A shortform standing alone is the word; so is a shortform followed by s or 's, except abouts, almosts and hims.", refs: [{section: "10.9.1", page: 146}, {section: "10.9.5", page: 151}]}
      - {step: "Inside a longer letters-sequence that stands alone and does not begin with a grade 1 symbol, read a shortform when the resolved word (with any s or 's) is on the Shortforms List; with an interior capitals indicator or terminator, only when listed in that format (DeafBlind).", refs: [{section: "10.9.2", page: 147}, {section: "10.9.4", page: 150}, {section: "Appendix 1", page: 243}]}
      - {step: "Otherwise read it only when each shortform used meets 10.9.3: braille and great anywhere; children not followed by a vowel or y; blind, first, friend, good, letter, little and quick at the beginning of the word and not followed by a vowel or y.", refs: [{section: "10.9.3", page: 149}]}
      - {step: "Prefer the reading that uses the most qualifying shortforms: a transcriber marks a letters-sequence that would read as a shortform with a grade 1 indicator (10.9.7-10.9.9).", refs: [{section: "10.9.7", page: 152}, {section: "10.9.8", page: 152}, {section: "10.9.9", page: 152}]}
    followed_by: the first print letter after the shortform in the resolved word; 10.9.3 excludes a following vowel or y
  writing_rules:
    summary: >-
      These rules decide whether a transcriber contracts. A reader reads whatever sign was written,
      so they need no back-translation logic; a ueb2 user who writes against them gets the
      reading-rule meaning of what they typed.
    rules:
      - {rule: "Alphabetic wordsigns not for letters pronounced separately or for syllables", ref: {section: "10.1.3", page: 116}}
      - {rule: "ch sh th wh ou st spelled out where the groupsign would read as a word; ing not at the beginning of a word", ref: {section: "10.4.2", page: 121}}
      - {rule: "be con dis for a first syllable; in abbreviations only when in the full word", ref: {section: "10.6.1", page: 127}}
      - {rule: "ea not across a prefix", ref: {section: "10.6.7", page: 132}}
      - {rule: "Lower sign rules: no sequence of only lower signs", ref: {section: "10.6.10", page: 134}}
      - {rule: "Initial-letter contractions by pronunciation and meaning (upon ... under)", ref: {section: "10.7.2", page: 137}}
      - {rule: "ity and ness exceptions", ref: {section: "10.8.3", page: 145}}
      - {rule: "No groupsign that would create a shortform word", ref: {section: "10.9.6", page: 151}}
      - {rule: "Preference among groupsigns", ref: {section: "10.10", page: 153}}
      - {rule: "Bridging: compound words, aspirated h, prefixes, suffixes, diphthongs", ref: {section: "10.11", page: 157}}
      - {rule: "Abbreviations, computer material, dialect, fragments, unknown pronunciation, medial punctuation, omitted letters, spelling, stammering, syllables", ref: {section: "10.12", page: 163}}
      - {rule: "Word division between braille lines", ref: {section: "10.13", page: 173}}
  ambiguous_sequences:
    summary: Cells that read as contracted or uncontracted, and what decides.
    cases:
      - cells: "⠃ (any alphabetic wordsign)"
        readings: "but when standing alone; the letter b elsewhere; a standing-alone letter is written ⠰⠃"
        refs: [{section: "10.1.1", page: 113}, {section: "5.7.1", page: 60}]
        fixtures:
          - {print: "x", braille: "⠰⠭", cells: [[5, 6], [1, 3, 4, 6]], ref: {section: "2.6.1", page: 15}}
          - {print: "it", braille: "⠭", cells: [[1, 3, 4, 6]], ref: {section: "2.6.1", page: 15}}
          - {print: "b-1", braille: "⠰⠃⠤⠼⠁", cells: [[5, 6], [1, 2], [3, 6], [3, 4, 5, 6], [1]], ref: {section: "5.7.1", page: 60}}
      - cells: "⠁⠃ (any shortform)"
        readings: "about when standing alone; the letters when written ⠰⠁⠃ or not standing alone"
        refs: [{section: "10.9.1", page: 146}, {section: "10.9.7", page: 152}, {section: "2.6.3", page: 18}]
        fixtures:
          - {print: "also", braille: "⠁⠇", cells: [[1], [1, 2, 3]], ref: {section: "2.6.1", page: 15}}
          - {print: "al", braille: "⠰⠁⠇", cells: [[5, 6], [1], [1, 2, 3]], ref: {section: "2.6.1", page: 15}}
          - {print: "ab/cd", braille: "⠁⠃⠸⠌⠉⠙", cells: [[1], [1, 2], [4, 5, 6], [3, 4], [1, 4], [1, 4, 5]], ref: {section: "2.6.3", page: 18}}
      - cells: "⠌ (any strong wordsign)"
        readings: "still standing alone; st inside a word; St is written ⠠⠎⠞"
        refs: [{section: "10.2.1", page: 116}, {section: "10.4.2", page: 121}]
        fixtures:
          - {print: "still-life and whiskey-still", braille: "⠌⠤⠇⠊⠋⠑ ⠯ ⠱⠊⠎⠅⠑⠽⠤⠌", cells: [[3, 4], [3, 6], [1, 2, 3], [2, 4], [1, 2, 4], [1, 5], [], [1, 2, 3, 4, 6], [], [1, 5, 6], [2, 4], [2, 3, 4], [1, 3], [1, 5], [1, 3, 4, 5, 6], [3, 6], [3, 4]], ref: {section: "10.2.1", page: 117}}
          - {print: "sting", braille: "⠌⠬", cells: [[3, 4], [3, 4, 6]], ref: {section: "10.4.3", page: 122}}
          - {print: "St.", braille: "⠠⠎⠞⠲", cells: [[6], [2, 3, 4], [2, 3, 4, 5], [2, 5, 6]], ref: {section: "10.4.2", page: 121}}
      - cells: "⠆"
        readings: "be standing alone; be at word-start before a letter; bb between letters; semicolon otherwise"
        refs: [{section: "10.5.1", page: 123}, {section: "10.6.2", page: 128}, {section: "10.6.5", page: 129}]
        fixtures:
          - {print: "to be", braille: "⠞⠕ ⠆", cells: [[2, 3, 4, 5], [1, 3, 5], [], [2, 3]], ref: {section: "10.5.1", page: 123}}
          - {print: "being", braille: "⠆⠬", cells: [[2, 3], [3, 4, 6]], ref: {section: "10.6.1", page: 127}}
          - {print: "rabbi", braille: "⠗⠁⠆⠊", cells: [[1, 2, 3, 5], [1], [2, 3], [2, 4]], ref: {section: "10.6.5", page: 130}}
          - {print: "very, very still; rather good.", braille: "⠧⠂ ⠧ ⠌⠆ ⠗ ⠛⠙⠲", cells: [[1, 2, 3, 6], [2], [], [1, 2, 3, 6], [], [3, 4], [2, 3], [], [1, 2, 3, 5], [], [1, 2, 4, 5], [1, 4, 5], [2, 5, 6]], ref: {section: "2.6.3", page: 17}}
      - cells: "⠒"
        readings: "con at word-start before a letter; cc between letters; colon otherwise; a colon between letters is written ⠰⠒"
        refs: [{section: "10.6.2", page: 128}, {section: "10.6.5", page: 129}, {section: "7.1.3", page: 77}]
        fixtures:
          - {print: "cont", braille: "⠒⠞", cells: [[2, 5], [2, 3, 4, 5]], ref: {section: "10.6.4", page: 129}}
          - {print: "account", braille: "⠁⠒⠨⠞", cells: [[1], [2, 5], [4, 6], [2, 3, 4, 5]], ref: {section: "10.6.5", page: 129}}
          - {print: "d:", braille: "⠰⠙⠒", cells: [[5, 6], [1, 4, 5], [2, 5]], ref: {section: "2.6.3", page: 17}}
          - {print: "a:o", braille: "⠁⠰⠒⠕", cells: [[1], [5, 6], [2, 5], [1, 3, 5]], ref: {section: "7.1.3", page: 78}}
      - cells: "⠲"
        readings: "dis at word-start before a letter; full stop otherwise; a full stop before letters at word-start is written ⠰⠲"
        refs: [{section: "10.6.2", page: 128}, {section: "7.1.3", page: 77}]
        fixtures:
          - {print: "disco", braille: "⠲⠉⠕", cells: [[2, 5, 6], [1, 4], [1, 3, 5]], ref: {section: "10.6.1", page: 127}}
          - {print: "dist.", braille: "⠲⠞⠲", cells: [[2, 5, 6], [2, 3, 4, 5], [2, 5, 6]], ref: {section: "10.6.4", page: 129}}
          - {print: ".doc", braille: "⠰⠲⠙⠕⠉", cells: [[5, 6], [2, 5, 6], [1, 4, 5], [1, 3, 5], [1, 4]], ref: {section: "7.1.3", page: 78}}
      - cells: "⠂"
        readings: "ea between letters; comma otherwise"
        refs: [{section: "10.6.5", page: 129}]
        fixtures:
          - {print: "areas", braille: "⠜⠂⠎", cells: [[3, 4, 5], [2], [2, 3, 4]], ref: {section: "10.6.5", page: 129}}
          - {print: "(q, r)", braille: "⠐⠣⠰⠟⠂ ⠰⠗⠐⠜", cells: [[5], [1, 2, 6], [5, 6], [1, 2, 3, 4, 5], [2], [], [5, 6], [1, 2, 3, 5], [5], [3, 4, 5]], ref: {section: "2.6.3", page: 17}}
      - cells: "⠖"
        readings: "ff between letters; exclamation mark otherwise; ! between letters is written ⠰⠖"
        refs: [{section: "10.6.5", page: 129}, {section: "7.1.3", page: 77}]
        fixtures:
          - {print: "muffin", braille: "⠍⠥⠖⠔", cells: [[1, 3, 4], [1, 3, 6], [2, 3, 5], [3, 5]], ref: {section: "10.6.5", page: 130}}
          - {print: "rejoice!", braille: "⠗⠚⠉⠖", cells: [[1, 2, 3, 5], [2, 4, 5], [1, 4], [2, 3, 5]], ref: {section: "2.6.3", page: 17}}
          - {print: "Ai!!ams", braille: "⠠⠁⠊⠰⠖⠖⠁⠍⠎", cells: [[6], [1], [2, 4], [5, 6], [2, 3, 5], [2, 3, 5], [1], [1, 3, 4], [2, 3, 4]], ref: {section: "7.1.3", page: 78}}
      - cells: "⠶"
        readings: "were standing alone without lower contact; gg between letters"
        refs: [{section: "10.5.1", page: 123}, {section: "10.6.5", page: 129}]
        fixtures:
          - {print: "(Were there many?)", braille: "⠐⠣⠠⠶ ⠐⠮ ⠸⠍⠦⠐⠜", cells: [[5], [1, 2, 6], [6], [2, 3, 5, 6], [], [5], [2, 3, 4, 6], [], [4, 5, 6], [1, 3, 4], [2, 3, 6], [5], [3, 4, 5]], ref: {section: "10.5.1", page: 123}}
          - {print: "begging", braille: "⠃⠑⠶⠬", cells: [[1, 2], [1, 5], [2, 3, 5, 6], [3, 4, 6]], ref: {section: "10.6.5", page: 129}}
      - cells: "⠢"
        readings: "enough standing alone; en everywhere else; en standing alone is spelled out"
        refs: [{section: "10.5.2", page: 124}, {section: "10.6.9", page: 133}]
        fixtures:
          - {print: "it was enough", braille: "⠭ ⠴ ⠢", cells: [[1, 3, 4, 6], [], [3, 5, 6], [], [2, 6]], ref: {section: "10.5.2", page: 124}}
          - {print: "been", braille: "⠃⠑⠢", cells: [[1, 2], [1, 5], [2, 6]], ref: {section: "10.6.1", page: 127}}
          - {print: "en route", braille: "⠑⠝ ⠗⠳⠞⠑", cells: [[1, 5], [1, 3, 4, 5], [], [1, 2, 3, 5], [1, 2, 5, 6], [2, 3, 4, 5], [1, 5]], ref: {section: "10.6.9", page: 133}}
      - cells: "⠦"
        readings: "his standing alone without lower contact; opening double quote at word-start; question mark elsewhere"
        refs: [{section: "10.5.1", page: 123}, {section: "7.6.7", page: 85}, {section: "7.6.8", page: 85}]
