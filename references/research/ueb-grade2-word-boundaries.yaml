back_translation:
  summary: >-
    What ueb2 needs to resolve a buffered word, reusing the phase 02 engine: the context fields
    numeric, caps and word_start, their class transition table, and the word-start constraint.
  reused:
    - {item: "context fields numeric, caps, word_start and their transition table", source: references/research/ueb-indicator-context.yaml}
    - {item: "word-start constraint = word_start true", source: references/research/ueb-indicator-context.yaml}
    - {item: "ueb1 signs as the uncontracted readings", source: references/research/ueb-literary-signs.yaml}
  added:
    - {item: "a grade 1 mode context field", detail: references/research/ueb-grade2-indicator-interactions.yaml}
    - {item: "the conditions standing-alone, after-alphabetic, before-alphabetic (word-middle is both), no-lower-contact and shortform-word", detail: "normative.conditions"}
    - {item: "the Shortforms List and the 10.9.3 rules as data", detail: references/research/ueb-grade2-contractions.yaml}
  scope_of_a_decision: >-
    Every condition is bounded by a space, hyphen or dash (2.6), so it is decided inside one
    symbols-sequence: nothing after the word's whitespace changes how the word reads, and nothing
    before its start does except the context fields (capitals passage, grade 1 passage).
  procedure:
    - Read the symbols-sequence left to right with the ueb1 context rules; at each sign try, while grade1-off holds, the contraction rows whose conditions hold, longest first, else the ueb1 meaning.
    - Evaluate before-alphabetic and standing-alone on the rest of the buffered sequence; they never need cells beyond its end.
    - Then apply shortform_words to each standing-alone letters-sequence, and re-read the sequence with the shortforms it qualifies for.
    - Emit the print; cells with no reading follow the shared pending-input policy, as in ueb1.

firmware_choices:
  - choice: "The Braille space, Return and Tab chords are the only word boundaries outside the buffer; each is a space for standing-alone purposes."
    reason: "The rulebook's braille space includes the end of a braille line (2.1); the plan resolves a word only on these whitespace chords."
  - choice: "A buffer resolved at 32 cells is treated as ending at a word boundary, and the next cell begins a word."
    reason: "The rulebook has no length limit; the plan resolves a full buffer as if a word boundary were reached."
  - choice: "ueb2 applies reading rules only and reads input that breaks a writing rule by the reading rules (⠆⠔⠄ reads as bein')."
    reason: "Writing rules depend on pronunciation and meaning (10.6.1, 10.7, 10.10, 10.11), which a keyboard cannot know, and never change how a written sign reads (2.4.3)."
  - choice: "Dashes (⠠⠤, ⠐⠠⠤) count as word boundaries in the conditions, but ueb1 gives them no output, so they do not occur in typed input."
    reason: "Phase 03 limits literary signs to keyboard characters (ueb-literary-signs.yaml); en and em dashes are not on the US keyboard."

