        - {print: "ar", braille: "⠜", dots: [[3, 4, 5]], rule: "10.4.1", page: 119}
    - id: lower_wordsigns
      definition: "lower: containing neither dot 1 nor dot 4"
      definition_ref: {section: "2.1", page: 8}
      ref: {section: "10.5", page: 122}
      count: 6
      use:
        - {kind: reading, rule: "be, were, his and was only when standing alone and not in contact with punctuation that has only lower dots, including the hyphen, the dash and any quotation mark; capitals indicators are disregarded.", refs: [{section: "10.5.1", page: 123}]}
        - {kind: reading, rule: "A standing-alone double quotation mark reads as his (⠦) or was (⠴); a standing-alone ⠠⠦, ⠠⠴ or ⠠⠶ reads as His, Was or Were.", refs: [{section: "7.6.8", page: 85}, {section: "7.6.10", page: 86}]}
        - {kind: reading, rule: "enough when standing alone, and in enough's.", refs: [{section: "10.5.2", page: 124}]}
        - {kind: reading, rule: "in wherever the word occurs.", refs: [{section: "10.5.3", page: 125}]}
