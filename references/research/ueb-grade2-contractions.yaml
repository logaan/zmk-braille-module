  not_ueb:
    summary: Contractions of other forms of English braille that UEB does not use; ueb2 has no rule for them.
    ref: {section: "1.3.2", page: 3}
    signs:
      - {print: "o'clock", braille: "⠕⠄⠉", dots: [[1, 3, 5], [3], [1, 4]], note: "shortform"}
      - {print: "dd", braille: "⠲", dots: [[2, 5, 6]], note: "groupsign between letters"}
      - {print: "to", braille: "⠖", dots: [[2, 3, 5]], note: "wordsign unspaced from the following word"}
      - {print: "into", braille: "⠔⠖", dots: [[3, 5], [2, 3, 5]], note: "wordsign unspaced from the following word"}
      - {print: "by", braille: "⠴", dots: [[3, 5, 6]], note: "wordsign unspaced from the following word"}
      - {print: "ble", braille: "⠼", dots: [[3, 4, 5, 6]], note: "groupsign following other letters"}
      - {print: "com", braille: "⠤", dots: [[3, 6]], note: "groupsign at the beginning of a word"}
      - {print: "ation", braille: "⠠⠝", dots: [[6], [1, 3, 4, 5]], note: "groupsign following other letters"}
      - {print: "ally", braille: "⠠⠽", dots: [[6], [1, 3, 4, 5, 6]], note: "groupsign following other letters"}
    also: Other forms write the wordsigns for a, and, for, of, the and with unspaced from one another (1.3.1, page 3); UEB spaces them.
  general_restrictions:
    - {rule: "No contractions in grade 1 mode, whether set by a grade 1 indicator or by a numeric indicator.", section: "2.5.1", page: 14}
    - {rule: "No contractions following a modifier, or before or after a ligature indicator.", section: "2.5.1", page: 14}
  writing_only_sections:
    summary: >-
      These sections choose between contractions or decide whether to contract; they do not change
      how a written sign is read.
    sections:
      - {topic: "Preference among groupsigns", section: "10.10", page: 153}
      - {topic: "Bridging compound words, prefixes, suffixes and diphthongs", section: "10.11", page: 157}
      - {topic: "Abbreviations, dialect, fragments, unknown pronunciation, lisping, omitted letters, stammering, syllabified words", section: "10.12", page: 163}
      - {topic: "Word division at the end of a braille line; keyboard input never divides a word between lines", section: "10.13", page: 173}
  discrepancies:
    - issue: >-
        Appendix 2 lists "Al" as ⠠⠁⠇ citing 10.9.7, but under 10.9.7 a standing-alone ⠠⠁⠇ reads as
        "Also" and needs a grade 1 indicator; the 10.9.7 example itself writes Al's as ⠰⠠⠁⠇⠄⠎.
      refs: [{section: "Appendix 2", page: 256}, {section: "10.9.7", page: 152}]
      treatment: The reading rules follow 10.9.7; the Appendix 2 entry is not used as a fixture.

firmware_choices:
  - choice: "ueb2 includes every class above in full, and the Shortforms List as printed in the pinned rulebook."
    reason: "The plan requires the rulebook's contractions in full, not a subset; ICEB maintains the list, so it is pinned with the rulebook."
  - choice: "A contraction emits the host keystrokes of its print letters: lowercase; with the capital prefix only its first letter is uppercase (8.3.2); in a capitalised word or passage every letter is uppercase."
    reason: "Output is ordinary host keystrokes, not Unicode braille (root plan 4.4.2)."
  - choice: "Every contraction rule is a letter-class rule in the context transition table; a contraction with the capital prefix is a capital-letter-class rule."
    reason: "Contractions are alphabetic (2.1), so they continue a capitalised word; a capital prefix is a single capital letter, which ends one (8.4.2)."
  - choice: "Longer words on the Shortforms List are data for an eligibility check on the resolved word, not rules of their own."
    reason: "Several listed words need more than 8 cells (unfriendlinesses); every shortform itself fits the 8-chord rule limit."

