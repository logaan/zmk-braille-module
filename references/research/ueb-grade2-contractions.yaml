        - {kind: reading, rule: "be, con and dis are not used when followed by a capitals indicator or terminator.", refs: [{section: "10.6.3", page: 128}]}
        - {kind: reading, rule: "ea, bb, cc, ff and gg only when preceded and followed by a letter, a contraction, a modified letter or a ligatured letter.", refs: [{section: "10.6.5", page: 129}]}
        - {kind: reading, rule: "ea, bb, cc, ff and gg are not used when preceded or followed by a capitals indicator or terminator.", refs: [{section: "10.6.6", page: 131}]}
        - {kind: reading, rule: "en and in wherever the letters occur; ⠢ standing alone is the wordsign enough, never en.", refs: [{section: "10.6.8", page: 132}, {section: "10.6.9", page: 133}]}
