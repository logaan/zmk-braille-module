# UEB Grade 2 contractions: the complete inventory for ueb2.
# Research record for the Braille module plan (phase 07 UEB Grade 2 extension).

question: >-
  Which contractions does the pinned ICEB rulebook define for contracted (grade 2) UEB, in
  which classes, with which dot patterns, and where does it restrict each class?

source:
  rulebook: references/iceb/rules-of-unified-english-braille-2024.pdf
  edition: The Rules of Unified English Braille, Third Edition 2024 (ICEB)
  sha256: bf742499ee2eb3cbdf4914d97bbf0b2857bd3e91621f04a4990091b64e5a105e
  page: printed page number; the PDF page is the printed page + 28
  verified: >-
    Every braille character in the PDF (44,539) was rendered and its raised dots compared with
    the text layer's code point, with no mismatch; the few hyphens the text layer gives as an
    ASCII '-' render as dots 3,6. Every row below was matched to its row in the Section 10 table,
    whose spelled-out column spells the listed word, and the 328 Shortforms List words were
    matched to Appendix 1. A reference back-translator built from the reading rules in this file
    and ueb-grade2-word-boundaries.yaml reproduces all in-scope rulebook examples it was run on:
    1,489 Section 10 examples and 1,038 of the 1,043 Appendix 2 words (the misses are two
    ligatured words, two pairing artifacts and the Appendix 2 entry noted under discrepancies).

conventions:
  dots: list of cells in order; each cell lists its raised dots (1-6); [] is the Braille space chord
  braille: Unicode braille of the same cells, for reading only; dots is authoritative
  print: the letters the contraction stands for, as lowercase host keystrokes
  rule: the rule governing the entry; the table's own see-reference where it gives one
  kind: >-
    reading rules decide what a sign means; writing rules decide whether a transcriber uses a
    contraction and never change how a written sign is read (2.4.3, page 12). ueb2 back-translates
    input, so it implements the reading rules; the writing rules are listed for completeness.

related:
  word_boundaries: references/research/ueb-grade2-word-boundaries.yaml
  indicator_interactions: references/research/ueb-grade2-indicator-interactions.yaml
  ueb1_signs: references/research/ueb-literary-signs.yaml
  context_representation: references/research/ueb-indicator-context.yaml

normative:
