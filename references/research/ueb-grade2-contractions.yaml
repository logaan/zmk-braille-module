        - {print: "for", braille: "⠿", dots: [[1, 2, 3, 4, 5, 6]], rule: "10.3.1", page: 118}
        - {print: "of", braille: "⠷", dots: [[1, 2, 3, 5, 6]], rule: "10.3.1", page: 118}
