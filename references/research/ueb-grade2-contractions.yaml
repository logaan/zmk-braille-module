        - {kind: writing, rule: "ch, sh, th, wh, ou and st are brailled as letters where the groupsign would be misread as a word (Sh!, St.).", refs: [{section: "10.4.2", page: 121}]}
        - {kind: writing, rule: "ing is not used at the beginning of a word.", refs: [{section: "10.4.3", page: 122}]}
