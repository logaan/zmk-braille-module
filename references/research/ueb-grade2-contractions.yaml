    alphabetic_wordsigns: 23
    strong_wordsigns: 6
    strong_contractions: 5
    strong_groupsigns: 12
    lower_wordsigns: 6
    lower_groupsigns: 10
    initial_letter_contractions: 33
    final_letter_groupsigns: 12
    shortforms: 75
    total: 182
    shortforms_list_longer_words: 328
  refs:
    - {rule: "contractions summary: every class and member", section: "2.2", page: 9}
    - {rule: "class definitions (alphabetic wordsign, groupsign, lower, strong, initial-letter, final-letter, shortform)", section: "2.1", page: 7}
    - {rule: "the classes in detail", section: "10.1-10.9", page: 113}
  longest_sign: {cells: 5, example: perceiving, braille: "⠏⠻⠉⠧⠛", note: "six cells with a capital prefix; every contraction fits the 8-chord rule limit"}
  classes:
    - id: alphabetic_wordsigns
      definition: "any one of the wordsigns in which a letter represents a word"
      definition_ref: {section: "2.1", page: 7}
      ref: {section: "10.1", page: 113}
      count: 23
      use:
        - {kind: reading, rule: "The letter is read as the word only when it is standing alone.", refs: [{section: "10.1.1", page: 113}]}
        - {kind: reading, rule: "Also when followed by an apostrophe and d, ll, re, s, t or ve, provided the resulting word is standing alone (it'd, you're, can't).", refs: [{section: "10.1.2", page: 115}]}
        - {kind: reading, rule: "Otherwise the cell is the letter; a letter standing alone takes a grade 1 indicator (see ueb-grade2-indicator-interactions.yaml).", refs: [{section: "5.7.1", page: 60}]}
        - {kind: writing, rule: "Preferably not used where the letters are pronounced separately, as in an acronym.", refs: [{section: "10.1.3", page: 116}]}
        - {kind: writing, rule: "Not used for a syllable of a word shown in syllables.", refs: [{section: "10.1.4", page: 116}]}
      note: "The letters a, i and o have no contraction meaning when standing alone (5.2.1 note, page 57)."
      entries:
