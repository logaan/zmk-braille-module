        - {print: "that", braille: "⠞", dots: [[2, 3, 4, 5]], rule: "10.1.1", page: 113}
        - {print: "us", braille: "⠥", dots: [[1, 3, 6]], rule: "10.1.1", page: 113}
        - {print: "very", braille: "⠧", dots: [[1, 2, 3, 6]], rule: "10.1.1", page: 113}
        - {print: "it", braille: "⠭", dots: [[1, 3, 4, 6]], rule: "10.1.1", page: 113}
