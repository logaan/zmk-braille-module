        - {print: "can", braille: "⠉", dots: [[1, 4]], rule: "10.1.1", page: 113}
        - {print: "do", braille: "⠙", dots: [[1, 4, 5]], rule: "10.1.1", page: 113}
        - {print: "every", braille: "⠑", dots: [[1, 5]], rule: "10.1.1", page: 113}
