        - {print: "just", braille: "⠚", dots: [[2, 4, 5]], rule: "10.1.1", page: 113}
        - {print: "knowledge", braille: "⠅", dots: [[1, 3]], rule: "10.1.1", page: 113}
        - {print: "like", braille: "⠇", dots: [[1, 2, 3]], rule: "10.1.1", page: 113}
